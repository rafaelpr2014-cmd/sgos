</head><body><script>
function getApiBase(){
    const salvo = localStorage.getItem("api_base");
    if(salvo) return String(salvo).replace(/\/$/, "");

    const provedor = localStorage.getItem("provedor");
    if(provedor) return `https://${provedor}.sgos.net.br`;

    if(location.protocol.startsWith("http")){
        return location.origin;
    }

    return "";
}

function apiUrl(path){
    if(!path) return getApiBase();
    if(/^https?:\/\//i.test(path)) return path;

    const base = getApiBase();
    if(!base) return path;

    return base + (path.startsWith("/") ? path : "/" + path);
}

function headersSessaoApp(){
 const u=getUsuarioLocal();
 const headers={
  "Accept":"application/json",
  "x-usuario-id":String(u.id||localStorage.getItem("usuario_id")||""),
  "x-sgos-app":"1",
  "x-sgos-active":"1"
 };
 const logId=u.log_id||localStorage.getItem("log_id")||"";
 const empresaId=u.empresa_id||localStorage.getItem("empresa_id")||"";
 const token=localStorage.getItem("token")||localStorage.getItem("auth_token")||u.token||"";
 if(logId)headers["x-log-id"]=String(logId);
 if(empresaId)headers["x-empresa-id"]=String(empresaId);
 if(token)headers["Authorization"]=`Bearer ${token}`;
 return headers;
}
function apiFetch(path,opt={}){
 const urlFinal=apiUrl(path);
 const opcoes={...opt};
 const headers=new Headers(opcoes.headers||{});
 Object.entries(headersSessaoApp()).forEach(([k,v])=>{if(v!==""&&!headers.has(k))headers.set(k,v)});
 opcoes.headers=headers;
 try{
  const destino=new URL(urlFinal,window.location.href);
  opcoes.credentials=destino.origin===window.location.origin?(opcoes.credentials||"same-origin"):"omit";
 }catch(e){opcoes.credentials=opcoes.credentials||"same-origin"}
 return fetch(urlFinal,opcoes);
}

function resolverUrlArquivo(url){
    if(!url) return "";
    if(/^https?:\/\//i.test(url)) return url;
    return apiUrl(url.startsWith("/") ? url : "/" + url);
}

function getUsuarioLocal(){try{return JSON.parse(localStorage.getItem("usuario")||"{}")}catch(e){return {}}}
function getTecnicoId(user){return user.tecnico_id||user.tecnicoId||user.id_tecnico||user.idTecnico||user.id}
function getNomeTecnico(user){return (user.tecnico_nome||user.nome||user.usuario||"").toString().toLowerCase()}
function abrirMenu(){document.getElementById("sideDrawer")?.classList.add("open");document.getElementById("drawerOverlay")?.classList.add("show")}
function fecharMenu(){document.getElementById("sideDrawer")?.classList.remove("open");document.getElementById("drawerOverlay")?.classList.remove("show")}
function logout(){localStorage.removeItem("usuario");localStorage.removeItem("usuario_id");window.location.href="index.html"}
async function prepararTopo(active){
 const user=getUsuarioLocal();
 if(!user.id){window.location.href="index.html";return null}
 let completo={};
 try{const r=await apiFetch("/api/me",{headers:{"x-usuario-id":user.id}});completo=await r.json()}catch(e){}
 const u={...user,...(completo||{})};localStorage.setItem("usuario",JSON.stringify(u));
 const nome=u.usuario||u.nome||("ID "+u.id); const emp=u.empresa_nome||"SGOS Técnico";
 ["topUser","drawerUser"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerText=nome});
 ["topEmpresa","drawerEmpresa"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerText=emp});

 let logoEmpresa = u.empresa_logo || "https://iili.io/CujQzXa.png";

if (logoEmpresa) {
    logoEmpresa = resolverUrlArquivo(logoEmpresa);
}

// Logo da empresa (topo)
const topLogo = document.getElementById("topLogo");
if (topLogo) {
    topLogo.src = logoEmpresa;
}

 document.querySelectorAll(".drawer-nav a").forEach(a=>{if(a.dataset.page===active)a.classList.add("active")});
 return u;
}
function mobileLayout(title, subtitle, active){return `
<div class="mobile-shell">
<div class="drawer-overlay" id="drawerOverlay" onclick="fecharMenu()"></div>
<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-head">
        <img id="drawerLogo" src="https://iili.io/C5XGAnp.png" alt="SGOS">
        <button class="drawer-close" onclick="fecharMenu()" type="button" aria-label="Fechar menu">×</button>
    </div>

    <div class="drawer-user">
        <strong id="drawerUser">Carregando...</strong>
        <small id="drawerEmpresa">Empresa</small>
    </div>

    <nav class="drawer-nav">
        <a data-page="os" href="appmobile.html"><span class="ico">▤</span><span>Ordens de Serviço</span></a>
        <a data-page="escala" href="app-escala.html"><span class="ico">□</span><span>Escala</span></a>
        <a data-page="viabilidades" href="app-viabilidades.html"><span class="ico">⌖</span><span>Viabilidades</span></a>
        <a data-page="planos" href="app-planos.html"><span class="ico">▣</span><span>Planos</span></a>
        <a data-page="historico" href="app-historico-os.html" class="active"><span class="ico">◷</span><span>Histórico de OS</span></a>
    </nav>

    <div class="drawer-footer">
        <button class="drawer-logout" onclick="logout()" type="button">Sair</button>
    </div>
</aside>
<div class="mobile-topbar-app"><button class="menu-btn" onclick="abrirMenu()" type="button" aria-label="Abrir menu"><span></span></button><div class="topbar-title"><strong>${title}</strong><small id="topEmpresa">${subtitle}</small></div><img id="topLogo" class="topbar-brand" src="" alt="Logo da empresa"></div>
`;}
function formatarDataHora(v){if(!v)return"-";const d=new Date(v);return isNaN(d)?"-":d.toLocaleString("pt-BR")}
function formatarData(v){if(!v)return"-";const d=new Date((String(v).split("T")[0]||v)+"T00:00:00");return isNaN(d)?"-":d.toLocaleDateString("pt-BR")}
</script><script>document.write(mobileLayout("Histórico de OS","SGOS Técnico","historico"));</script><main class="content">
<div class="mini-cards"><div class="mini-card"><strong id="cardTotal">0</strong><span id="labelTotalHistorico">Minhas OS</span></div><div class="mini-card"><strong id="cardFiltro">0</strong><span>Exibidas</span></div><div class="mini-card"><strong id="cardPeriodo">7</strong><span>Dias</span></div></div>
<div class="card-box"><h2 class="section-title">Filtros</h2><select class="select" id="filtroPeriodo" onchange="aplicarPeriodo()"><option value="7" selected>Últimos 7 dias</option><option value="15">Últimos 15 dias</option><option value="30">Últimos 30 dias</option><option value="">Todo período</option></select><div class="grid-2" style="margin-top:10px"><input class="input" type="date" id="dataInicio"><input class="input" type="date" id="dataFim"></div><input class="input" style="margin-top:10px" id="buscaHistorico" placeholder="Buscar cliente, localidade ou serviço..." oninput="renderHistorico()"><button class="btn block" style="margin-top:10px" onclick="carregarHistorico()">Atualizar</button></div><div id="listaHistorico"></div>
</main></div><script>
let usuarioAtual=null, historico=[];
function normalizarTextoAcesso(v){return String(v??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function ehAdministrador(u){const acesso=normalizarTextoAcesso([u?.cargo,u?.perfil,u?.tipo,u?.nivel,u?.funcao,u?.role].filter(Boolean).join(" "));return /(^|\s)(admin|administrador|administradora|master|superadmin)(\s|$)/.test(acesso)||u?.is_admin===true||Number(u?.administrador)===1}
function achatarTecnicos(valor,saida=[]){if(valor===null||valor===undefined||valor==="")return saida;if(Array.isArray(valor)){valor.forEach(x=>achatarTecnicos(x,saida));return saida}if(typeof valor==="object"){[valor.id,valor.tecnico_id,valor.id_tecnico,valor.nome,valor.usuario].forEach(x=>achatarTecnicos(x,saida));return saida}const txt=String(valor).trim();if(!txt)return saida;if((txt.startsWith("[")&&txt.endsWith("]"))||(txt.startsWith("{")&&txt.endsWith("}"))){try{return achatarTecnicos(JSON.parse(txt),saida)}catch(e){}}txt.split(/[,;|]/).map(x=>x.trim()).filter(Boolean).forEach(x=>saida.push(x));return saida}
function pertenceAoTecnico(os,u){const tid=String(getTecnicoId(u)||"").trim();const nome=normalizarTextoAcesso(getNomeTecnico(u));const valores=[os.tecnico_id,os.id_tecnico,os.tecnicos_ids,os.tecnico_ids,os.tecnico,os.tecnicos,os.tecnicos_nomes];const tecnicos=valores.flatMap(x=>achatarTecnicos(x,[]));return tecnicos.some(item=>{const bruto=String(item).trim();const texto=normalizarTextoAcesso(bruto);if(tid&&/^\d+$/.test(bruto)&&bruto===tid)return true;return !!nome&&(texto===nome||texto.includes(nome)||nome.includes(texto))})}
function dataISOlocal(data){const d=new Date(data);const pad=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function aplicarPeriodo(){
 const periodo=document.getElementById('filtroPeriodo').value;
 document.getElementById('cardPeriodo').innerText=periodo||'Tudo';
 if(!periodo){document.getElementById('dataInicio').value='';document.getElementById('dataFim').value='';renderHistorico();return}
 const hoje=new Date(); const ini=new Date(hoje); ini.setDate(hoje.getDate()-(Number(periodo)-1));
 document.getElementById('dataInicio').value=dataISOlocal(ini);
 document.getElementById('dataFim').value=dataISOlocal(hoje);
 renderHistorico();
}
function extrairHistoricoResposta(data){
 if(Array.isArray(data))return data;
 for(const chave of ['dados','historico','ordens','ordens_servico','items','rows','resultados','results']){if(Array.isArray(data?.[chave]))return data[chave]}
 return [];
}
function filtrarHistoricoTecnicoComFallback(lista,u){
 if(ehAdministrador(u))return lista;
 const correspondentes=lista.filter(os=>pertenceAoTecnico(os,u));
 // A rota de histórico pode já vir filtrada pelo usuário/técnico no backend.
 // Se os campos de vínculo não vierem na listagem, não descarta toda a resposta.
 return correspondentes.length ? correspondentes : lista;
}
async function carregarHistorico(){
 const el=document.getElementById('listaHistorico'); el.innerHTML='<div class="empty">Carregando histórico...</div>';
 try{
  const tecnicoId=getTecnicoId(usuarioAtual);
  const headers={'x-usuario-id':usuarioAtual.id,'x-usuario-cargo':usuarioAtual.cargo||''};
  if(tecnicoId)headers['x-tecnico-id']=String(tecnicoId);
  const r=await apiFetch('/api/ordens_servico/historico?page=1&limit=1000&_='+Date.now(),{headers,cache:'no-store'});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.erro||data.mensagem||`Erro ${r.status}`);
  const lista=extrairHistoricoResposta(data);
  const admin=ehAdministrador(usuarioAtual);
  historico=filtrarHistoricoTecnicoComFallback(lista,usuarioAtual);
  const label=document.getElementById('labelTotalHistorico');if(label)label.textContent=admin?'Todas as OS':'Minhas OS';
  renderHistorico();
 }catch(err){console.error(err);el.innerHTML=`<div class="empty">Erro ao carregar histórico.<br><small>${String(err.message||'')}</small></div>`}
}
function dataHistoricoOS(os){return String(os.finalizado_em||os.finalizada_em||os.concluido_em||os.concluida_em||os.data_finalizacao||os.data_conclusao||os.atualizado_em||os.updated_at||os.criado_em||os.created_at||'').slice(0,10)}
function renderHistorico(){
 const ini=document.getElementById('dataInicio').value; const fim=document.getElementById('dataFim').value; const busca=(document.getElementById('buscaHistorico').value||'').toLowerCase();
 let lista=historico.filter(os=>{
  const d=dataHistoricoOS(os); if(ini&&d&&d<ini)return false; if(fim&&d&&d>fim)return false;
  const txt=`${os.nome||os.cliente||''} ${os.localidade_nome||os.localidade||''} ${os.rua||os.endereco||''} ${os.bairro||''} ${os.tipo_servico_nome||os.tipo_servico||''} ${os.status||''} ${os.tecnicos_nomes||os.tecnico||''}`.toLowerCase();
  return !busca||txt.includes(busca);
 });
 lista.sort((a,b)=>dataHistoricoOS(b).localeCompare(dataHistoricoOS(a))||Number(b.id||0)-Number(a.id||0));
 document.getElementById('cardTotal').innerText=historico.length;document.getElementById('cardFiltro').innerText=lista.length;
 const el=document.getElementById('listaHistorico');
 if(!lista.length){el.innerHTML=`<div class="empty">${ehAdministrador(usuarioAtual)?'Nenhuma OS encontrada no período.':'Nenhuma OS atribuída a este técnico no período.'}</div>`;return}
 el.innerHTML=lista.map(os=>`<div class="list-card"><h3>OS #${os.id} <span class="pill green">${os.status||'Finalizada'}</span></h3><p><b>Cliente:</b> ${os.nome||os.cliente||'-'}</p><p><b>Localidade:</b> ${os.localidade_nome||os.localidade||'-'}</p><p><b>Serviço:</b> ${os.tipo_servico_nome||os.tipo_servico||'-'}</p><p><b>Endereço:</b> ${os.rua||os.endereco||'-'} ${os.bairro?'('+os.bairro+')':''}</p><p><b>Finalizado em:</b> ${formatarDataHora(os.finalizado_em||os.finalizada_em||os.concluido_em||os.concluida_em||os.data_finalizacao||os.data_conclusao||os.atualizado_em||os.updated_at)}</p><p><b>Técnico:</b> ${os.tecnicos_nomes||os.tecnico||os.tecnico_nome||os.finalizado_por_nome||'-'}</p></div>`).join('');
}
document.addEventListener('DOMContentLoaded',async()=>{usuarioAtual=await prepararTopo('historico');if(!usuarioAtual)return;aplicarPeriodo();carregarHistorico();});
</script></body></html>
