<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SGOS - Empresas</title><link rel="icon" type="image/png" href="/img/favicon.png"><script src="/js/auth.js"></script>
<script src="/js/init.js"></script>
<style>
:root{--azul:#2563eb;--texto:#0f172a;--muted:#64748b;--borda:#e2e8f0;--fundo:#f5f7fb;--verde:#16a34a;--vermelho:#dc2626;--laranja:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--texto)}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;align-items:center;gap:15px}.brand img{height:48px;max-width:160px}.brand h1{font-size:19px;margin:0}.page{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.page-head h2{margin:0;font-size:26px}.page-head p{margin:6px 0 0;color:var(--muted)}.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn-primary{background:var(--azul);color:#fff}.btn-edit{background:#ffedd5;color:#c2410c}.btn-delete{background:#fee2e2;color:var(--vermelho)}.btn-toggle{background:#dcfce7;color:#15803d}.toolbar{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;gap:12px}.toolbar input{width:360px;max-width:100%;padding:11px 13px;border:1px solid var(--borda);border-radius:10px;font:inherit}.table-card{background:#fff;border:1px solid var(--borda);border-radius:15px;overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.05)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1250px}th,td{padding:13px 14px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:middle;font-size:13px}th{background:#0f2f5f;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.3px}tr:hover td{background:#f8fafc}.logo{width:52px;height:42px;object-fit:contain;border:1px solid var(--borda);border-radius:8px;background:#fff}.logos-wrap{display:flex;align-items:flex-start;gap:7px}.logo-item{display:flex;flex-direction:column;align-items:center;gap:3px}.logo-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.2px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.badge-on{background:#dcfce7;color:#15803d}.badge-off{background:#e2e8f0;color:#475569}.badge-blue{background:#dbeafe;color:#1d4ed8}.badge-purple{background:#ede9fe;color:#6d28d9}.actions{display:flex;gap:6px;flex-wrap:wrap}.report-box{line-height:1.65;min-width:220px}.report-box strong{display:block}.muted{color:var(--muted)}.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:800px){.topbar{padding:15px;height:auto}.page{padding:18px 12px}.page-head{align-items:flex-start;flex-direction:column}.btn-primary{width:100%}.toolbar input{width:100%}}
</style></head>
<body>
<header class="topbar"><div class="brand"><img src="https://iili.io/CujQzXa.png" alt="SGOS"><h1>Empresas cadastradas</h1></div></header>
<main class="page"><div class="page-head"><div><h2>Gestão de empresas</h2><p>Consulte dados, status e configuração dos relatórios automáticos.</p></div><a class="btn btn-primary" href="/cadastrar_empresa.html">+ Nova empresa</a></div>
<div class="toolbar"><input id="busca" type="search" placeholder="Buscar por nome, documento, cidade ou subdomínio..."></div>
<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Documento</th><th>Contato</th><th>Localização</th><th>Plano</th><th>Relatórios automáticos</th><th>Status</th><th>Ações</th></tr></thead><tbody id="corpoTabela"></tbody></table></div></div></main>
<script>
function obterUsuario(){try{return JSON.parse(localStorage.getItem('usuario'))}catch{return null}}
function obterEmpresaIdUsuario(usuario){
  return Number(usuario?.empresa_id ?? usuario?.empresaId ?? usuario?.id_empresa ?? 0);
}
function validarAcessoAdministrador(){
  const usuario=obterUsuario();
  if(!usuario){ location.replace('/login.html'); return false; }
  if(obterEmpresaIdUsuario(usuario)!==1){
    alert('Acesso restrito. Somente a empresa administradora pode acessar esta página.');
    location.replace('/painel.html');
    return false;
  }
  return true;
}
if(!validarAcessoAdministrador()) throw new Error('Acesso não autorizado');let empresasCache=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function nomeEmpresa(e){return e.pessoa_fisica?(e.nome_provedor||e.nome_completo):(e.nome_fantasia||e.razao_social)||'Empresa sem nome'}
function periodicidades(e){let p=e.relatorio_periodicidades||e.relatorio_periodicidade||[];if(typeof p==='string'){try{p=JSON.parse(p)}catch{p=p.split(',')}}return Array.isArray(p)?p:[]}
function metodoLabel(v){return({email:'E-mail',whatsapp:'WhatsApp',ambos:'WhatsApp + E-mail'})[v]||'Não definido'}
function render(lista){const tbody=document.getElementById('corpoTabela');if(!lista.length){tbody.innerHTML='<tr><td colspan="8" class="empty">Nenhuma empresa encontrada.</td></tr>';return}tbody.innerHTML=lista.map(e=>{const ps=periodicidades(e);const ativo=Number(e.relatorio_ativo)===1;const logo=e.logo?`<img class="logo" src="/uploads/logos/${encodeURIComponent(e.logo)}" alt="Logo principal">`:'<div class="logo"></div>';const logoAlternativa=e.logo_alternativa?`<img class="logo" src="/uploads/logos/${encodeURIComponent(e.logo_alternativa)}" alt="Logo alternativa">`:'<div class="logo"></div>';const logos=`<div class="logos-wrap"><div class="logo-item"><span class="logo-label">Principal</span>${logo}</div><div class="logo-item"><span class="logo-label">Informativos</span>${logoAlternativa}</div></div>`;return `<tr><td><div style="display:flex;align-items:center;gap:10px">${logos}<div><strong>${esc(nomeEmpresa(e))}</strong><div class="muted">${esc(e.subdominio||'Sem subdomínio')}</div></div></div></td><td>${esc(e.pessoa_fisica?e.cpf:e.cnpj)||'-'}<div class="muted">${e.pessoa_fisica?'Pessoa Física':'Pessoa Jurídica'}</div></td><td>${esc(e.telefone||'-')}<div class="muted">${esc(e.email||'-')}</div></td><td>${esc(e.cidade||'-')} / ${esc(e.estado||'-')}<div class="muted">${esc(e.endereco||'')}</div></td><td>${esc(e.plano_empresa||'-')}<div class="muted">Vencimento: ${esc(e.vencimento||'-')}</div></td><td><div class="report-box">${ativo?'<span class="badge badge-on">Ativo</span>':'<span class="badge badge-off">Desativado</span>'}<strong>${ps.length?ps.map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(', '):'Sem periodicidade'}</strong><span class="muted">${esc(metodoLabel(e.relatorio_envio_tipo))} • ${esc(e.relatorio_horario||'08:00')}</span></div></td><td>${Number(e.ativo)===1?'<span class="badge badge-on">Ativa</span>':'<span class="badge badge-off">Inativa</span>'}</td><td><div class="actions"><button class="btn btn-edit" onclick="editarEmpresa(${Number(e.id)})">Editar</button><button class="btn btn-toggle" onclick="toggleAtivo(${Number(e.id)})">${Number(e.ativo)===1?'Desativar':'Ativar'}</button><button class="btn btn-delete" onclick="removerEmpresa(${Number(e.id)})">Remover</button></div></td></tr>`}).join('')}
async function carregarEmpresas(){try{empresasCache=await fetchAuth('/api/empresa/listar');if(!Array.isArray(empresasCache))empresasCache=[];render(empresasCache)}catch(err){console.error(err);if(String(err?.message||'').includes('403')){alert('Acesso não autorizado.');location.replace('/painel.html');return}alert(err?.message||'Erro ao carregar empresas')}}
function editarEmpresa(id){location.href=`/cadastrar_empresa.html?id=${id}`}
async function removerEmpresa(id){if(!confirm('Deseja realmente remover esta empresa?'))return;try{await fetchAuth(`/api/empresa/${id}`,{method:'DELETE'});await carregarEmpresas()}catch(err){console.error(err);alert('Erro ao remover empresa')}}
async function toggleAtivo(id){try{await fetchAuth(`/api/empresa/toggle/${id}`,{method:'POST'});await carregarEmpresas()}catch(err){console.error(err);alert('Erro ao alterar status')}}
document.getElementById('busca').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();render(empresasCache.filter(x=>[nomeEmpresa(x),x.cpf,x.cnpj,x.cidade,x.estado,x.subdominio,x.email,x.telefone].some(v=>String(v||'').toLowerCase().includes(q))))});window.addEventListener('DOMContentLoaded',carregarEmpresas);
</script></body></html>
