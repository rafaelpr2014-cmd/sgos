<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGOS - Escritórios</title><link rel="icon" href="/img/favicon.png"><script src="/js/auth.js" defer></script><script src="/js/init.js" defer></script><style>
:root{--azul:#2563eb;--azul-hover:#1d4ed8;--texto:#0f172a;--muted:#64748b;--borda:#e5e7eb;--fundo:#f5f7fb;--verde:#16a34a;--laranja:#f59e0b;--vermelho:#ef4444;--roxo:#7c3aed}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--texto)}
.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:linear-gradient(180deg,#081a31,#061426);color:white;padding:12px 18px 18px;display:flex;flex-direction:column;z-index:20;overflow-y:auto}.sidebar-logo{display:flex;align-items:center;margin-bottom:14px}.sidebar-logo img{width:190px;height:auto}.menu-titulo{margin:14px 10px 6px;font-size:12px;color:#94a3b8;text-transform:uppercase}.sidebar a{color:#dbeafe;text-decoration:none;padding:11px 13px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:2px}.sidebar a:hover,.sidebar a.ativo{background:var(--azul);color:white}.menu-icon{width:18px;height:18px;min-width:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sidebar-footer{margin-top:auto}.btn-recolher{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#e5efff;padding:13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px}.sidebar.recolhida{width:82px;padding:16px 12px;align-items:center}.sidebar.recolhida .sidebar-logo img{width:48px}.sidebar.recolhida .menu-titulo,.sidebar.recolhida a span,.sidebar.recolhida .btn-recolher span{display:none}.sidebar.recolhida a,.sidebar.recolhida .btn-recolher{justify-content:center;width:52px}.sidebar.recolhida + .main{margin-left:82px;width:calc(100% - 82px)}
.main{margin-left:230px;min-height:100vh;transition:.25s;width:calc(100% - 230px);overflow-x:hidden}.header{height:92px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:10}.header-left,.header-actions{display:flex;align-items:center;gap:18px}.header-logo img{height:60px;max-width:190px;object-fit:contain}.divisor{height:34px;width:1px;background:var(--borda)}.header-title{font-weight:800;font-size:18px}.usuario-btn{border:0;background:transparent;display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center}.avatar svg{width:28px;fill:#cbd5e1}.usuario-info{text-align:left}.usuario-info strong{display:block;font-size:13px}.usuario-info small{font-size:11px;color:var(--muted)}
.content{padding:28px 18px 38px}.top-actions{display:grid;grid-template-columns:240px repeat(4,1fr);gap:16px;margin-bottom:20px}.action-card{height:118px;border:0;border-radius:14px;background:linear-gradient(135deg,#2563eb,#1263ff);color:#fff;font-weight:bold;font-size:15px;display:flex;align-items:center;gap:14px;padding:0 22px;cursor:pointer;box-shadow:0 10px 22px rgba(37,99,235,.22)}.action-card span{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--azul);display:flex;align-items:center;justify-content:center}.action-card svg,.icon-box svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.card-indicador{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:18px;min-height:118px;box-shadow:0 8px 22px rgba(15,23,42,.05);display:flex;align-items:center;gap:14px}.icon-box{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center}.icon-blue{background:#dbeafe;color:#2563eb}.icon-green{background:#dcfce7;color:#16a34a}.icon-orange{background:#ffedd5;color:#f59e0b}.icon-red{background:#fee2e2;color:#ef4444}.card-info small{font-size:12px;font-weight:800}.card-info strong{display:block;font-size:28px;margin:6px 0}.card-info span{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 8px 20px rgba(15,23,42,.04)}.card-header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.titulo-card{font-size:18px;font-weight:800}.sub-card{color:var(--muted);font-size:13px;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#e2e8f0;color:#334155}.tab.ativo{background:var(--azul);color:#fff}.painel-tab{display:none}.painel-tab.ativo{display:block}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.campo{display:flex;flex-direction:column}.campo.span-2{grid-column:span 2}.campo.span-4{grid-column:span 4}.campo label{font-size:13px;font-weight:800;color:#334155;margin-bottom:6px}input,select,textarea{padding:11px 12px;border:1px solid var(--borda);border-radius:10px;outline:none;font-size:14px;width:100%;background:#fff;color:#0f172a}textarea{min-height:88px;resize:vertical}.hint{font-size:11px;color:var(--muted);margin-top:5px}.form-actions,.filter-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:bold}.btn-primary{background:var(--azul);color:#fff}.btn-success{background:var(--verde);color:#fff}.btn-warning{background:var(--laranja);color:#fff}.btn-danger{background:var(--vermelho);color:#fff}.btn-light{background:#e2e8f0;color:#0f172a}.btn-purple{background:var(--roxo);color:#fff}.btn-icon{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}.btn-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.filtros{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:16px}.table-wrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1180px}th{background:#f8fafc;padding:13px 11px;text-align:left;font-size:12px;border-bottom:1px solid var(--borda);white-space:nowrap}td{padding:12px 11px;border-bottom:1px solid var(--borda);font-size:13px;color:#1e293b;vertical-align:middle}tr:hover{background:#f8fbff}.pill{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}.pill-entrada{background:#dcfce7;color:#15803d}.pill-saida{background:#fee2e2;color:#dc2626}.pill-adicionado{background:#dbeafe;color:#1d4ed8}.pill-editado{background:#fef3c7;color:#92400e}.pill-excluido{background:#fee2e2;color:#b91c1c}.valor-entrada{color:#15803d;font-weight:900}.valor-saida{color:#dc2626;font-weight:900}.relatorio-cabecalho{display:none}.relatorio-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.relatorio-resumo div{border:1px solid var(--borda);padding:10px;border-radius:8px}.relatorio-resumo strong{display:block;font-size:18px}.secao-tabela{margin-top:22px}.empty{text-align:center;padding:28px;color:var(--muted)}.footer{display:flex;justify-content:space-between;padding:20px 34px;color:#475569;font-size:12px;border-top:1px solid var(--borda)}.toast{position:fixed;right:22px;bottom:22px;z-index:2000;background:#0f172a;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 14px 35px rgba(15,23,42,.25);display:none}.toast.ativo{display:block}.toast.erro{background:#b91c1c}
@media(max-width:1400px){.top-actions{grid-template-columns:1fr 1fr 1fr}.form-grid{grid-template-columns:repeat(2,1fr)}.filtros{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.sidebar{display:none}.main{margin-left:0;width:100%}.header{height:auto;padding:18px;align-items:flex-start;flex-direction:column}.content{padding:18px}.top-actions,.form-grid,.filtros{grid-template-columns:1fr}.campo.span-2,.campo.span-4{grid-column:span 1}.footer{padding:18px;flex-direction:column;gap:6px}}
@media print{.sidebar,.header,.top-actions,.tabs,.filtros,.filter-actions,.form-actions,.btn-icon,.footer,.nao-imprimir{display:none!important}.main{margin:0;width:100%}.content{padding:0}.card{border:0;box-shadow:none;padding:0}.painel-tab{display:none!important}#tabRelatorios{display:block!important}.relatorio-cabecalho{display:flex!important;align-items:center;justify-content:space-between;border-bottom:2px solid #1d4ed8;padding:0 0 12px;margin-bottom:12px}.relatorio-cabecalho img{max-height:62px;max-width:180px;object-fit:contain}.relatorio-titulo{text-align:center;flex:1}.relatorio-titulo h1{font-size:20px;margin:0 0 4px}.relatorio-titulo p{font-size:11px;margin:2px 0}.relatorio-emissao{text-align:right;font-size:10px;min-width:190px}.relatorio-resumo{display:grid!important;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 14px}.relatorio-resumo div{padding:7px;border:1px solid #cbd5e1}.relatorio-resumo span{font-size:9px}.relatorio-resumo strong{font-size:15px}table{min-width:0!important;font-size:9px}th,td{padding:6px 5px!important;white-space:normal!important}.table-wrap{overflow:visible}@page{size:A4 landscape;margin:10mm}}
</style></head><body><aside class="sidebar"><div class="sidebar-logo"><img src="https://iili.io/CujQzXa.png"></div><a href="painel.html"><span>⌂</span><span>Painel Inicial</span></a><a href="financeiro.html"><span>▣</span><span>Caixa</span></a><a href="escritorios.html" class="ativo"><span>▤</span><span>Escritórios</span></a><a href="usuarios.html"><span>○</span><span>Usuários</span></a></aside><main class="main"><header class="header"><div class="header-left"><div class="header-logo"><img id="logo" src="/img/logo-default.png"></div><div class="divisor"></div><div class="header-title">Escritórios e grupos de usuários</div></div><div class="usuario-info"><strong id="user">Carregando...</strong><small id="empresa">Empresa</small></div></header><section class="content"><div class="card"><div class="tabs"><button class="tab ativo" data-tab="lista" onclick="tab('lista')">Escritórios</button><button class="tab" data-tab="cadastro" onclick="tab('cadastro');limpar()">Cadastrar / Editar</button></div><div id="tabLista" class="painel-tab ativo"><div class="card-header"><div><div class="titulo-card">Escritórios cadastrados</div><div class="sub-card">Cada escritório forma um grupo com os usuários responsáveis.</div></div><button class="btn-primary" onclick="carregar()">Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>Escritório</th><th>Descrição</th><th>Responsáveis</th><th>Situação</th><th>Cadastrado por</th><th>Ações</th></tr></thead><tbody id="tb"></tbody></table></div></div><div id="tabCadastro" class="painel-tab"><input type="hidden" id="id"><div class="form-grid"><div class="campo span-2"><label>Nome *</label><input id="nome"></div><div class="campo"><label>Situação</label><select id="ativo"><option value="1">Ativo</option><option value="0">Inativo</option></select></div><div class="campo span-4"><label>Descrição</label><textarea id="descricao"></textarea></div><div class="campo span-4"><label>Usuários responsáveis *</label><select id="responsaveis" multiple style="height:180px"></select><div class="hint">Use Ctrl para selecionar vários usuários no computador.</div></div></div><div class="form-actions"><button class="btn-primary" onclick="salvar()">Salvar escritório</button><button class="btn-light" onclick="limpar()">Limpar</button></div></div></div></section></main><div id="toast" class="toast"></div><script>
let dados=[],users=[];const $=i=>document.getElementById(i),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(u,o={}){return fetchAuth(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}})}function toast(t,e=false){$('toast').textContent=t;$('toast').className='toast ativo'+(e?' erro':'');setTimeout(()=>$('toast').className='toast',3000)}function tab(n){document.querySelectorAll('.painel-tab,.tab').forEach(x=>x.classList.remove('ativo'));$('tab'+n[0].toUpperCase()+n.slice(1)).classList.add('ativo');document.querySelector(`[data-tab="${n}"]`).classList.add('ativo')}async function carregar(){dados=await req('/api/escritorios');$('tb').innerHTML=dados.length?dados.map(x=>`<tr><td><strong>${esc(x.nome)}</strong></td><td>${esc(x.descricao||'-')}</td><td>${esc(x.responsaveis_nomes||'Nenhum responsável')}</td><td><span class="pill ${x.ativo?'pill-entrada':'pill-saida'}">${x.ativo?'Ativo':'Inativo'}</span></td><td>${esc(x.cadastrado_por_nome||'-')}</td><td><button class="btn-warning btn-icon" onclick="editar(${x.id})">✎</button> <button class="btn-danger btn-icon" onclick="excluir(${x.id})">×</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum escritório cadastrado.</td></tr>'}async function carregarUsuarios(){users=await req('/api/escritorios/usuarios');$('responsaveis').innerHTML=users.map(x=>`<option value="${x.id}">${esc(x.usuario)} · ${esc(x.cargo||'')}</option>`).join('')}function limpar(){$('id').value='';$('nome').value='';$('descricao').value='';$('ativo').value='1';[...$('responsaveis').options].forEach(o=>o.selected=false)}async function editar(id){const x=await req('/api/escritorios/'+id);$('id').value=x.id;$('nome').value=x.nome;$('descricao').value=x.descricao||'';$('ativo').value=x.ativo?'1':'0';const ids=new Set((x.responsaveis||[]).map(r=>Number(r.usuario_id)));[...$('responsaveis').options].forEach(o=>o.selected=ids.has(Number(o.value)));tab('cadastro')}async function salvar(){const id=$('id').value,b={nome:$('nome').value,descricao:$('descricao').value,ativo:$('ativo').value==='1',responsaveis:[...$('responsaveis').selectedOptions].map(o=>Number(o.value))};try{await req('/api/escritorios'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(b)});toast('Escritório salvo.');limpar();await carregar();tab('lista')}catch(e){toast(e.message||'Erro ao salvar.',true)}}async function excluir(id){if(!confirm('Excluir ou inativar este escritório?'))return;try{const r=await req('/api/escritorios/'+id,{method:'DELETE'});toast(r.inativado?'Escritório inativado porque possui movimentações.':'Escritório excluído.');carregar()}catch(e){toast(e.message,true)}}document.addEventListener('DOMContentLoaded',async()=>{try{const me=await fetchAuth('/api/me');const cargo=String(me.cargo||'').toLowerCase();if(!['admin','administrador'].includes(cargo)){alert('Apenas administradores podem gerenciar escritórios.');location.href='financeiro.html';return}$('user').textContent=me.usuario;$('empresa').textContent=me.empresa_nome||'Empresa';$('logo').src=me.empresa_logo?(me.empresa_logo.startsWith('/')?me.empresa_logo:'/'+me.empresa_logo):'/img/logo-default.png';await carregarUsuarios();await carregar();limpar()}catch(e){alert('Não foi possível carregar escritórios.')}})</script></body></html>
