<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SGOS Mobile</title>


<style>
:root{
    --azul:#1769ff;
    --azul-2:#0f52d9;
    --azul-soft:#eaf2ff;
    --navy:#081a31;
    --navy-2:#0d2647;
    --fundo:#f3f6fb;
    --card:#ffffff;
    --texto:#0f172a;
    --texto-2:#334155;
    --muted:#64748b;
    --borda:#e7ecf3;
    --verde:#16a34a;
    --laranja:#f59e0b;
    --vermelho:#ef4444;
    --whatsapp:#25D366;
    --shadow:0 14px 36px rgba(15,23,42,.08);
    --shadow-soft:0 8px 24px rgba(15,23,42,.06);
    --radius:22px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    font-family:Inter, Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(23,105,255,.08), transparent 32%),
        linear-gradient(180deg,#f8fbff 0%,var(--fundo) 48%,#eef3f9 100%);
    color:var(--texto);
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:calc(env(safe-area-inset-bottom) + 18px);
}

/* ===== TOPBAR ===== */
.mobile-topbar-app{
    min-height:94px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(226,232,240,.9);
    display:flex;
    align-items:center;
    gap:14px;
    padding:
        calc(env(safe-area-inset-top) + 20px)
        16px
        14px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 8px 24px rgba(15,23,42,.05);
}

.menu-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:15px;
    background:linear-gradient(145deg,var(--navy),var(--navy-2));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(8,26,49,.24);
    flex:0 0 auto;
}

.menu-btn span{
    display:block;
    width:21px;
    height:2px;
    background:#fff;
    position:relative;
    border-radius:99px;
}

.menu-btn span:before,
.menu-btn span:after{
    content:"";
    position:absolute;
    left:0;
    width:21px;
    height:2px;
    background:#fff;
    border-radius:99px;
}

.menu-btn span:before{top:-7px}
.menu-btn span:after{top:7px}

.topbar-title{min-width:0;flex:1}
.topbar-title strong{
    display:block;
    font-size:17px;
    line-height:1.15;
    letter-spacing:-.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.topbar-title small{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ===== HEADER ===== */
.header{
    position:relative;
    z-index:1;
    background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);
    margin:14px 12px 0;
    padding:20px 18px 18px;
    border:1px solid rgba(226,232,240,.95);
    border-radius:26px;
    box-shadow:var(--shadow);
    overflow:hidden;
}

.header:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    right:-85px;
    top:-95px;
    background:radial-gradient(circle,rgba(23,105,255,.16),transparent 65%);
    pointer-events:none;
}

.empresa-box{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:2px 0 16px;
    min-height:100px;
}

.logo-empresa{
    max-height:92px;
    max-width:82%;
    width:auto;
    object-fit:contain;
    filter:drop-shadow(0 8px 18px rgba(15,23,42,.06));
}

#nomeEmpresa{
    font-size:12px;
    color:#cbd5e1;
}

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-top:14px;
    border-top:1px solid #edf1f6;
}

.user-box{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--texto-2);
    font-weight:700;
    font-size:14px;
    min-width:0;
}

#user{
    font-weight:900;
    color:var(--texto);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.logout{
    background:#fff1f2;
    border:1px solid #fecdd3;
    color:#dc2626;
    padding:10px 14px;
    border-radius:14px;
    font-weight:900;
    cursor:pointer;
    box-shadow:none;
}

/* ===== SEARCH ===== */
.busca{
    padding:14px 12px 4px;
}

.busca input{
    width:100%;
    padding:15px 16px;
    border-radius:18px;
    border:1px solid var(--borda);
    background:rgba(255,255,255,.96);
    color:var(--texto);
    font-size:15px;
    outline:none;
    box-shadow:var(--shadow-soft);
}

.busca input::placeholder{color:#94a3b8}
.busca input:focus{
    border-color:#9fc1ff;
    box-shadow:0 0 0 4px rgba(23,105,255,.10),var(--shadow-soft);
}

/* ===== STATUS CARDS ===== */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px 12px 14px;
}

.card{
    min-height:98px;
    padding:14px 8px;
    border-radius:22px;
    color:#fff;
    text-align:center;
    cursor:pointer;
    transition:.2s ease;
    box-shadow:0 12px 26px rgba(15,23,42,.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:12px;
    font-weight:900;
    border:1px solid rgba(255,255,255,.18);
}

.card span{
    font-size:30px;
    line-height:1;
    letter-spacing:-1px;
}

.andamento{background:linear-gradient(145deg,#f59e0b,#f97316)}
.ausente{background:linear-gradient(145deg,#ef4444,#dc2626)}
.concluido{background:linear-gradient(145deg,#16a34a,#22c55e)}

.active{
    transform:translateY(-3px);
    outline:3px solid rgba(23,105,255,.12);
}

/* ===== OS LIST ===== */
.container{
    padding:2px 12px 22px;
}

.container > p{
    background:#fff;
    border:1px solid var(--borda);
    border-radius:22px;
    padding:34px 16px;
    text-align:center;
    color:var(--muted);
    font-weight:800;
    box-shadow:var(--shadow-soft);
}

.os{
    background:rgba(255,255,255,.98);
    border:1px solid var(--borda);
    padding:18px 16px 72px 18px;
    border-radius:24px;
    margin-bottom:14px;
    cursor:pointer;
    position:relative;
    box-shadow:var(--shadow);
    font-size:14px;
    line-height:1.58;
    color:#475569;
    overflow:hidden;
}

.os:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:6px;
    height:100%;
    background:linear-gradient(180deg,var(--azul),#4f8dff);
}

.os b{color:var(--texto)}
.os > b:first-of-type{
    display:inline-flex;
    align-items:center;
    background:var(--azul-soft);
    color:var(--azul-2);
    padding:7px 11px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:6px;
    letter-spacing:.1px;
}

.data-right{
    position:absolute;
    right:15px;
    top:18px;
    max-width:44%;
    text-align:right;
    font-size:11px;
    color:#64748b;
    font-weight:800;
    line-height:1.35;
}

.btn-whatsapp{
    position:absolute;
    right:14px;
    bottom:14px;
    width:50px;
    height:50px;
    border-radius:17px;
    border:none;
    background:linear-gradient(145deg,#2bd96d,#18b957);
    color:#fff;
    font-size:22px;
    box-shadow:0 12px 24px rgba(37,211,102,.28);
    cursor:pointer;
}

.badge-avulsa{
    display:inline-block;
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fed7aa;
    padding:6px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:900;
    margin-left:6px;
}

.sva-card{
    margin-top:12px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:16px;
    padding:12px;
    color:#1e3a8a;
    line-height:1.55;
}

/* ===== MODALS ===== */
.modal,
.modal-anexo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(15,23,42,.72);
    display:none;
    justify-content:center;
    z-index:9999;
    padding:16px;
}

.modal{align-items:flex-end}
.modal-anexo{align-items:center;z-index:10000}

.modal-content{
    background:#fff;
    padding:22px;
    border-radius:26px 26px 20px 20px;
    width:100%;
    max-width:460px;
    max-height:92dvh;
    overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.34);
    animation:modalUp .2s ease-out;
}

@keyframes modalUp{
    from{transform:translateY(20px);opacity:.35}
    to{transform:translateY(0);opacity:1}
}

.modal-content h3{
    margin:0 0 16px;
    color:var(--texto);
    font-size:21px;
    text-align:center;
}

.modal input,
.modal textarea{
    width:100%;
    margin:6px 0 10px;
    padding:13px;
    border:1px solid var(--borda);
    border-radius:14px;
    outline:none;
    font-size:14px;
    background:#fff;
}

.modal button{
    width:100%;
    margin:6px 0;
    padding:13px;
    border:none;
    border-radius:14px;
    color:#fff;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
}

.btn-ausente{background:#f59e0b}
.btn-inv{background:#ef4444}
.btn-ok{background:#16a34a}
.btn-loc{background:var(--navy)}
.modal button:last-child{background:#64748b}

.resumo-modal-os{
    background:#f8fafc;
    border:1px solid var(--borda);
    border-radius:16px;
    padding:14px;
    margin-bottom:14px;
    font-size:13px;
    line-height:1.6;
    color:#334155;
}

.modal-anexo-content{
    width:100%;
    max-width:520px;
    height:88dvh;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.38);
}

.modal-anexo-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:13px 15px;
    border-bottom:1px solid var(--borda);
}

.btn-fechar-anexo{
    width:38px;
    height:38px;
    border:none;
    border-radius:12px;
    background:#ef4444;
    color:#fff;
    font-size:22px;
}

.anexo-viewer{
    flex:1;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
}
.anexo-viewer iframe{width:100%;height:100%;border:0;background:#fff}
.anexo-viewer img{max-width:100%;max-height:100%;object-fit:contain}
.anexo-msg{color:#fff;text-align:center;padding:18px;font-weight:800}

/* ===== TOAST ===== */
.toast-os{
    position:fixed;
    top:-130px;
    left:50%;
    transform:translateX(-50%);
    background:#ef4444;
    color:#fff;
    padding:16px 20px;
    border-radius:18px;
    font-weight:900;
    font-size:15px;
    z-index:999999;
    box-shadow:0 16px 36px rgba(239,68,68,.32);
    transition:.35s;
    opacity:0;
    text-align:center;
    width:calc(100% - 32px);
    max-width:420px;
}
.toast-os.show{top:calc(env(safe-area-inset-top) + 18px);opacity:1}

/* ===== DRAWER ===== */
.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.56);
    z-index:1999;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}
.drawer-overlay.show{opacity:1;pointer-events:auto}

.side-drawer{
    position:fixed;
    left:0;
    top:0;
    height:100dvh;
    width:292px;
    max-width:84vw;
    background:linear-gradient(180deg,#081a31,#061426);
    z-index:2000;
    transform:translateX(-100%);
    transition:.25s ease;
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 18px);
    display:flex;
    flex-direction:column;
    box-shadow:18px 0 45px rgba(0,0,0,.34);
}
.side-drawer.open{transform:translateX(0)}

.drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}
.drawer-head img{
    width:174px;
    max-height:66px;
    object-fit:contain;
}
.drawer-close{
    width:40px;
    height:40px;
    border:none;
    border-radius:13px;
    background:rgba(255,255,255,.10);
    color:#fff;
    font-size:22px;
}
.drawer-user{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    padding:14px;
    margin-bottom:16px;
}
.drawer-user strong{display:block;font-size:14px}
.drawer-user small{display:block;color:#cbd5e1;font-size:12px;margin-top:4px}

.drawer-nav{display:flex;flex-direction:column;gap:8px}
.drawer-nav a{
    color:#dbeafe;
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px;
    border-radius:15px;
    font-size:15px;
    font-weight:900;
}
.drawer-nav a.active,
.drawer-nav a:hover{background:var(--azul);color:#fff}
.drawer-nav .ico{
    width:30px;
    height:30px;
    border-radius:10px;
    background:rgba(255,255,255,.10);
    display:flex;
    align-items:center;
    justify-content:center;
}
.drawer-footer{margin-top:auto}
.drawer-logout,
.drawer-push{
    width:100%;
    border:none;
    color:#fff;
    border-radius:15px;
    padding:13px;
    font-weight:900;
    font-size:14px;
}
.drawer-push{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    margin-bottom:10px;
}
.drawer-logout{background:#ef4444}

@media(min-width:760px){
    body{
        max-width:540px;
        margin:0 auto;
        background:#e5e7eb;
    }
}

@media(max-width:360px){
    .cards{gap:7px}
    .card{font-size:11px;min-height:90px}
    .card span{font-size:27px}
    .user-box{font-size:12px;max-width:220px}
}

/* ===== MODELO PROFISSIONAL SGOS 2026 ===== */
:root{
    --sidebar:200px;
    --ink:#07152c;
    --line:#dfe6f0;
}
button,input,textarea{font-family:inherit}
button{touch-action:manipulation}
.topbar-brand{
    width:142px;
    max-height:52px;
    object-fit:contain;
    flex:0 0 auto;
}
.drawer-avatar{
    width:74px;height:74px;margin:0 auto 10px;border-radius:50%;
    display:grid;place-items:center;font-size:38px;
    background:linear-gradient(145deg,#fff,#d8e2f0);color:#52627a;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.drawer-user{text-align:center;background:transparent;border:0;padding:8px 6px 14px}
.drawer-user strong{font-size:16px}
.drawer-user small{font-size:12px;margin-top:5px}
.drawer-user-logout{
    margin:14px auto 0;min-width:128px;padding:11px 16px;border-radius:13px;
    border:1px solid #ef4444;background:transparent;color:#ff5a5f;font-weight:900;
}
.busca{display:flex;gap:12px;align-items:center;padding:22px 22px 12px}
.busca-box{position:relative;flex:1}
.busca-icone{
    position:absolute;left:18px;top:50%;transform:translateY(-50%);
    font-size:27px;color:#60708b;line-height:1;z-index:2
}
.busca input{padding:17px 18px 17px 54px;border-radius:18px;box-shadow:0 7px 22px rgba(15,23,42,.05)}
.btn-filtro{
    width:58px;height:58px;border:1px solid var(--line);border-radius:17px;
    background:#fff;color:var(--ink);font-size:25px;box-shadow:var(--shadow-soft)
}
.cards{padding:12px 22px 18px;gap:18px}
.card{min-height:166px;border-radius:24px;font-size:16px;gap:12px}
.card span{font-size:38px}
.card br{display:none}
.lista-cabecalho{
    display:flex;align-items:center;justify-content:space-between;padding:0 22px 15px;
}
.lista-cabecalho strong{font-size:19px;color:var(--ink)}
.lista-cabecalho button{border:0;background:transparent;color:#075cf6;font-weight:900;font-size:14px}
.container{padding:0 22px 28px}
.os{
    padding:20px 52px 20px 22px;border-radius:22px;margin-bottom:13px;
    min-height:152px;line-height:1.55;box-shadow:0 7px 22px rgba(15,23,42,.055)
}
.os:before{display:none}
.os > b:first-of-type{
    background:transparent;color:var(--ink);padding:0;border-radius:0;
    font-size:19px;margin-bottom:8px
}
.os-linha{
    display:flex;align-items:center;gap:10px;color:#566783;margin-top:7px;font-size:14px
}
.os-linha .mini-ico{width:20px;text-align:center;color:#65758f}
.os-status{
    position:absolute;right:52px;top:20px;padding:7px 15px;border-radius:999px;
    background:#fff3e4;color:#f07a00;font-weight:900;font-size:12px
}
.os-hora{position:absolute;right:20px;bottom:45px;color:#566783;font-size:13px}
.os-seta{position:absolute;right:19px;top:50%;transform:translateY(-50%);font-size:28px;color:#5c6d88}
.btn-whatsapp{display:none}
.badge-avulsa{vertical-align:middle}
.header{display:none}
.mobile-topbar-app{padding-left:22px;padding-right:22px;min-height:86px}
.topbar-title strong{font-size:27px}
.topbar-title small{display:none}
.modal{padding:0;background:rgba(6,20,38,.52)}
.modal-content{
    max-width:760px;border-radius:34px 34px 0 0;padding:28px 30px calc(30px + env(safe-area-inset-bottom));
}
.modal-content h3{text-align:left;font-size:18px}
.resumo-modal-os{background:#fff;border-radius:20px;padding:20px}
.detalhes-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px}
.detalhes-info{min-width:0}
.detalhes-acoes{display:flex;flex-direction:column}
.detalhes-acoes button{min-height:48px}
.modal input[type=file],.modal textarea{background:#f8fafc}
.modal-acoes-status{display:contents}
.botao-carregando{opacity:.65;pointer-events:none}
.modal-anexo{padding:12px}
.anexo-viewer img{width:auto;height:auto}
.mobile-only{display:none}

@media(min-width:760px){
    body{max-width:980px;margin:0 auto;background:#f7f9fc}
    .mobile-topbar-app{justify-content:space-between;position:sticky;top:0}
    .topbar-title{flex:1}
    .topbar-title strong{font-size:30px}
    .cards,.container,.lista-cabecalho,.busca{max-width:980px;margin-left:auto;margin-right:auto}
    .side-drawer{width:320px;max-width:86vw}
}
@media(max-width:759px){
    .topbar-brand{width:112px}
    .topbar-title strong{font-size:19px}
    .mobile-topbar-app{padding-left:14px;padding-right:14px}
    .cards{gap:9px;padding-left:12px;padding-right:12px}
    .card{min-height:114px;font-size:12px;border-radius:20px}
    .card span{font-size:31px}
    .busca{padding:14px 12px 10px}
    .lista-cabecalho{padding-left:12px;padding-right:12px}
    .container{padding-left:12px;padding-right:12px}
    .detalhes-grid{grid-template-columns:1fr}
    .modal-content{padding:22px 16px calc(22px + env(safe-area-inset-bottom))}
}
@media(max-width:390px){
    .topbar-brand{width:94px}
    .topbar-title strong{font-size:17px}
    .btn-filtro{width:52px;height:52px}
    .busca input{padding-top:15px;padding-bottom:15px}
    .os-status{position:static;display:inline-block;margin:5px 0 3px}
}


.refresh-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:15px;
    background:#eef4ff;
    color:#0f52d9;
    font-size:28px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    box-shadow:0 8px 20px rgba(15,82,217,.10);
}
.refresh-btn.atualizando{
    animation:girarAtualizacao .8s linear infinite;
    pointer-events:none;

<script>

/* ================= API BASE LOCAL/REMOTO ================= */
function getApiBase(){
    const salvo = localStorage.getItem("api_base");
    if(salvo) return salvo.replace(/\/$/, "");

    const provedor = localStorage.getItem("provedor");
    if(provedor) return `https://${provedor}.sgos.net.br`;

    if(location.protocol.startsWith("http")){
        return location.origin;
    }

    return "";
}

function apiUrl(path){
    if(!path) return getApiBase();

    if(/^https?:\/\//i.test(path)){
        return path;
    }

    const base = getApiBase();

    if(!base){
        return path;
    }

    return base + (path.startsWith("/") ? path : "/" + path);
}

function apiFetch(path, options = {}){
    return fetch(apiUrl(path), options);
}

function getPlataformaApp(){
    try{
        if(window.Capacitor && typeof window.Capacitor.getPlatform === "function"){
            return window.Capacitor.getPlatform();
        }
    }catch(e){}
    return "web";
}

function formatarTelefoneApp(valor){
    try{
        if(!valor) return "-";

        if(Array.isArray(valor)){
            const item = valor.find(v => v && (v.contato || v.telefone || v.numero || v.celular)) || valor[0];
            return formatarTelefoneApp(item);
        }

        if(typeof valor === "object"){
            return valor.contato || valor.telefone || valor.numero || valor.celular || valor.whatsapp || "-";
        }

        const texto = String(valor).trim();
        return texto && texto !== "[object Object]" ? texto : "-";
    }catch(e){
        return "-";
    }
}


function carregarSocketIo(){
    return new Promise((resolve) => {
        if(typeof io === "function"){
            resolve(true);
            return;
        }

        const script = document.createElement("script");
        script.src = apiUrl("/socket.io/socket.io.js");
        script.onload = () => resolve(true);
        script.onerror = () => {
            console.warn("Não foi possível carregar Socket.IO remoto");
            resolve(false);
        };
        document.head.appendChild(script);
    });
}

// 🔑 LOGIN VIA APK
// =========================
const params =
new URLSearchParams(
    window.location.search
);

const token =
params.get("token");

const id =
params.get("id");

const app =
params.get("app");

const provedorParam = params.get("provedor");
if(provedorParam){
    localStorage.setItem("provedor", provedorParam);
    localStorage.setItem("api_base", `https://${provedorParam}.sgos.net.br`);
}

const osPushId = params.get("os_id") || params.get("os") || params.get("id_os");

// =========================
// RECEBE LOGIN APK
// =========================
if(token && id){

    // IMPORTANTE:
    // No app Android/iOS o WebView pode reabrir a última URL usada.
    // Se a URL antiga ainda tiver ?token=...&id=..., ela sobrescreve o login atual.
    // Por isso salvamos a sessão NOVA sem reaproveitar usuário antigo e limpamos a URL.

    const novoUsuarioApp = {
        id: String(id),
        log_id: String(token),
        usuario: params.get("usuario") || "",
        empresa_id: params.get("empresa_id") || params.get("empresaId") || "",
        empresa_nome: params.get("empresa_nome") || "",
        empresa_logo: params.get("empresa_logo") || ""
    };

    localStorage.setItem("usuario", JSON.stringify(novoUsuarioApp));
    localStorage.setItem("log_id", String(token));
    localStorage.setItem("usuario_id", String(id));
    localStorage.setItem("is_app", "1");

    const provedorSessao = params.get("provedor") || localStorage.getItem("provedor") || "";

    if(provedorSessao){
        localStorage.setItem("provedor", provedorSessao);
        localStorage.setItem("api_base", `https://${provedorSessao}.sgos.net.br`);
    }

    localStorage.setItem("sessao_app", JSON.stringify({
        provedor: provedorSessao,
        id: String(id),
        log_id: String(token),
        usuario: params.get("usuario") || "",
        empresa_id: params.get("empresa_id") || params.get("empresaId") || ""
    }));

    // Remove token/id da barra para o app não restaurar login antigo ao fechar e abrir.
    try{
        const limpa = new URL(window.location.href);
        limpa.searchParams.delete("token");
        limpa.searchParams.delete("id");
        limpa.searchParams.delete("usuario");
        limpa.searchParams.delete("empresa_id");
        limpa.searchParams.delete("empresaId");
        limpa.searchParams.delete("empresa_nome");
        limpa.searchParams.delete("empresa_logo");
        limpa.searchParams.delete("provedor");

        if(!limpa.searchParams.get("app")){
            limpa.searchParams.set("app", "1");
        }

        window.history.replaceState({}, document.title, limpa.pathname + limpa.search + limpa.hash);
    }catch(e){
        console.warn("Não foi possível limpar parâmetros de login da URL", e);
    }

    console.log("✅ sessão nova recebida APK", { id, token });

}

localStorage.getItem("is_app") === "1";

function normalizarStatusApp(status){
    const s = String(status || "").toLowerCase().trim();

    if(s.includes("andamento") || s.includes("exec")) return "em_andamento";
    if(s.includes("concl") || s.includes("final")) return "concluido";
    if(s.includes("ausente")) return "cliente_ausente";
    if(s.includes("abert")) return "aberto";
    if(s.includes("agend")) return "agendado";

    return s.replace(/\s+/g, "_");
}

function normalizarOSAvulsa(os){
    const endereco = os.endereco ||
        [os.rua, os.n, os.bairro].filter(Boolean).join(", ");

    return {

        referencia: os.referencia || "",
        bairro: os.bairro || "",

        observacao: os.observacao || os.observacoes || os.descricao || "",
        descricao: os.descricao || os.observacao || ""
    };
}

        ...os,
        _tipo: "normal",

function enderecoAvulsaLimpo(os){
    const texto = String(os.endereco || os.rua || "").trim();

    if(!texto) return "-";

    const idx = texto.toUpperCase().indexOf("CLIENTES:");
    if(idx >= 0){
        return texto.slice(0, idx).replace(/[,;\-\s]+$/g, "").trim() || "-";
    }

    return texto;
}

function descricaoAvulsaLimpa(os){
    const texto = String(os.descricao || os.observacao || os.referencia || "").trim();
    const endereco = String(os.endereco || os.rua || "").trim();

    let base = texto;

    const idxEnd = endereco.toUpperCase().indexOf("CLIENTES:");
    if(idxEnd >= 0){
        base = endereco.slice(idxEnd).trim();
    }

    const idx = base.toUpperCase().indexOf("CLIENTES:");
    if(idx >= 0){
        base = base.slice(idx).trim();
    }

    return base || "-";
}

function enderecoNormal(os){
    const partes = [];
    if(os.rua) partes.push(os.rua);
    if(os.n) partes.push(os.n);
    if(os.referencia) partes.push(os.referencia);
    if(os.bairro) partes.push(`(${os.bairro})`);

    return partes.join(", ").replace(", (", " (") || "-";
}

/* ================= SOCKET.IO REALTIME ================= */
function iniciarSocket(){
    try {
        if(socketConectado) return;
        if(typeof io !== "function"){
            console.warn("Socket.IO não carregado no appmobile.html");
            return;
        }

        socket = io(getApiBase(), {
            transports:["websocket", "polling"]
        });

        socket.on("connect", () => {
            console.log("✅ Socket conectado:", socket.id);
            socketConectado = true;

            if(user?.id && user?.empresa_id){
                socket.emit("join", {
                    id:user.id,
                    usuario:user.usuario || user.nome || "Técnico",
                    empresa_id:user.empresa_id
                });
            }
        });

        socket.on("disconnect", () => {
            console.warn("Socket desconectado");
            socketConectado = false;
        });

        socket.on("os_update", () => {
            console.log("🔄 os_update recebido via socket");
            load();
        });

        socket.on("nova_os", () => {
            console.log("🚨 nova_os recebido via socket");
            load();
        });

        socket.on("os_andamento", (data) => {
            console.log("🚀 os_andamento recebido via socket", data);

            mostrarNotificacaoCustom(
                data?.titulo || "🚀 NOVA OS LANÇADA!",
                data?.mensagem || "Uma OS entrou em andamento"
            );

            load();
        });

    } catch(err){
        console.error("Erro ao iniciar Socket.IO:", err);
    }
}

let idsJaCarregados = new Set();

async function load(){

    if(!user.id){
        console.error("Sem user.id");
        return;
    }

    try {

        const res = await apiFetch(API_PATH, {
            headers: {
                "x-usuario-id": user.id
            }
        });

        const listaNormal = await res.json();

        let listaAvulsas = [];

        try {
            const resAvulsas = await apiFetch("/api/os-avulsas/painel?periodo=30dias", {
                headers: {
                    "x-usuario-id": user.id
                }
            });

            if(resAvulsas.ok){
                listaAvulsas = await resAvulsas.json();
            }
        } catch(errAvulsa){
            console.warn("Não foi possível carregar OS Avulsas no app:", errAvulsa);
        }

        const novaLista = [
            ...(Array.isArray(listaNormal) ? listaNormal.map(normalizarOSNormal) : []),
            ...(Array.isArray(listaAvulsas) ? listaAvulsas.map(normalizarOSAvulsa) : [])
        ];

        // =========================
        // DETECTA NOVAS OS
        // =========================
        const novosIds = [];

        novaLista.forEach(os => {

            // primeira vez NÃO notifica
            if(primeiraCarga){
                idsJaCarregados.add(chaveOS(os));
                return;
            }

            // nova OS encontrada
            if(!idsJaCarregados.has(chaveOS(os))){

                idsJaCarregados.add(chaveOS(os));

                novosIds.push(chaveOS(os));

            }

        });

        // remove ids inexistentes
        const idsAtuais =
        new Set(novaLista.map(o => chaveOS(o)));

        idsJaCarregados.forEach(id => {

            if(!idsAtuais.has(id)){
                idsJaCarregados.delete(id);
            }

        });

        // =========================
        // NOTIFICA
        // =========================
        if(novosIds.length > 0){

            tocarSomNovaOS();

            mostrarNotificacao(novosIds.length);

            console.log(
                "Nova OS detectada:",
                novosIds
            );

        }

        primeiraCarga = false;

        OS = novaLista;

        abrirOSDaNotificacaoSeExistir();

    } catch (e){

        console.error(
            "Erro ao carregar OS:",
            e
        );

        OS = [];
    }

    render();
}

/* ================= RENDER ================= */
function render(){

    const inputBusca = document.getElementById("busca");
    const busca = inputBusca ? inputBusca.value.toLowerCase() : "";

    const norm = s => (s||"").toLowerCase();

    const filtrado = OS.filter(o => {

        const matchBusca =
            String(o.id).includes(busca) ||
            norm(o.nome).includes(busca);

        const matchStatus =
            (tab === "andamento" && norm(o.status).includes("andamento")) ||
            (tab === "concluido" && norm(o.status).includes("concluido")) ||
            (tab === "ausente" && norm(o.status).includes("ausente"));

        return matchBusca && matchStatus && dentroDoPeriodo(o);
    });

    // CONTADORES
    document.getElementById("cA").innerText =
        OS.filter(o => norm(o.status).includes("andamento")).length;

    document.getElementById("cC").innerText =
        OS.filter(o => norm(o.status).includes("concluido")).length;

    document.getElementById("cX").innerText =
        OS.filter(o => norm(o.status).includes("ausente")).length;

    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));

    el.innerHTML = filtrado.map(o => {

async function enviarAcao(tipo){

    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    const osAtual = encontrarOS(osSelecionada);

    if(!osAtual){
        alert("OS não encontrada");
        return;
    }

    if(osAtual._tipo === "avulsa"){
        if(tipo !== "concluir"){
            alert("Para OS Avulsa, use apenas a ação Concluir no app.");
            return;
        }

        try{
            const res = await apiFetch(`/api/os-avulsas/${osAtual.id}/status`, {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json",
                    "x-usuario-id": user.id
                },
                body:JSON.stringify({ status:"concluido" })
            });

            const data = await res.json().catch(() => ({}));

            if(!res.ok){
                throw new Error(data.erro || "Erro ao concluir OS Avulsa");
            }

            alert("OS Avulsa concluída com sucesso");
            fecharModal();
            load();
            return;

        }catch(err){
            console.error(err);
            alert("Erro ao concluir OS Avulsa");
            return;
        }
    }

    try {

        const obs = document.getElementById("obs").value;

        const fotoInput = document.getElementById("foto");

        const formData = new FormData();

        formData.append("observacao", obs);

        if(fotoInput.files[0]){
            formData.append("foto", fotoInput.files[0]);
        }

        let rota = "";
        const osIdAcao = osAtual.id;

        if(tipo === "ausente"){
            rota = `/api/ordens_servico/ausente/${osIdAcao}`;
        }

        if(tipo === "inviabilidade"){
            rota = `/api/ordens_servico/inviabilidade/${osIdAcao}`;
        }

        if(tipo === "concluir"){
            rota = `/api/ordens_servico/concluir/${osIdAcao}`;
        }

        const res = await apiFetch(rota, {
            method: "POST",
            headers: {
                "x-usuario-id": user.id
            },
            body: formData
        });

        const data = await res.json();

        if(!res.ok){
            throw new Error(data.erro || "Erro");
        }

        alert("OS atualizada com sucesso");

        fecharModal();

        load();

    } catch(err){

        console.error(err);

        alert("Erro ao executar ação");
    }
}

async function pegarLocalizacao(){

    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    const osAtual = encontrarOS(osSelecionada);
    if(osAtual && osAtual._tipo === "avulsa"){
        alert("Localização para OS Avulsa ainda não está disponível no app.");
        return;
    }

    if(!navigator.geolocation){
        alert("GPS não suportado neste dispositivo");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        try {

            const res = await apiFetch(`/api/ordens_servico/localizacao/${osAtual.id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-usuario-id": user.id
                },
                body: JSON.stringify({
    latitude: lat,
    longitude: lng
})
            });

            const data = await res.json();

            if(!res.ok){
                throw new Error(data.erro || "Erro ao salvar localização");
            }

            alert("📍 Localização enviada com sucesso!");

        } catch (err){
            console.error(err);
            alert("Erro ao enviar localização");
        }

    }, () => {
        alert("Não foi possível obter GPS");
    });

}

function visualizarLocalizacao(){

    const os = encontrarOS(osSelecionada);

    if(!os){
        alert("OS não encontrada");
        return;
    }

    if(!os.latitude || !os.longitude){
        alert("Sem localização registrada");
        return;
    }

    const url = `https://www.google.com/maps?q=${os.latitude},${os.longitude}`;

    window.open(url, "_blank");
}

        }).catch(console.error);
    }

    // Limpa sessão web completa
    try{ sessionStorage.clear(); }catch(e){}
    try{ localStorage.clear(); }catch(e){}

    // Limpa sessão salva no app nativo, se existir bridge Android/iOS.

    try{
        if(window.SGOSAndroid){
            if(typeof window.SGOSAndroid.limparUsuarioId === "function"){
                window.SGOSAndroid.limparUsuarioId();
            }
            if(typeof window.SGOSAndroid.salvarUsuarioId === "function"){
                window.SGOSAndroid.salvarUsuarioId("");

            if(typeof window.SGOSAndroid.logout === "function"){
                window.SGOSAndroid.logout();
            }
        }
    }catch(e){
        console.warn("Não foi possível limpar sessão nativa", e);
    }

    // Vai para a tela de login sem token/id antigo.
    window.location.replace("index.html?logout=1&t=" + Date.now());

async function salvarTokenPush(token, plataformaInformada){
    if(!token){
        console.warn("Token push vazio");
        return;
    }

    if(!user || !user.id){
        console.warn("Usuário não carregado; não foi possível salvar token push");
        return;
    }

    let plataforma = plataformaInformada || getPlataformaApp();

    // Mantém compatibilidade com o Android antigo que já funcionava.
    if(window.SGOSAndroid){
        plataforma = "android";
    }

    try {
        const res = await apiFetch("/api/push/token", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "x-usuario-id": user.id
            },
            body:JSON.stringify({
                token_fcm: String(token),
                plataforma: plataforma,
                device_id: getDeviceIdPush(plataforma)
            })
        });

        const data = await res.json().catch(() => ({}));

        if(!res.ok){
            throw new Error(data.erro || "Erro ao salvar token push");
        }

        localStorage.setItem("push_token_fcm", String(token));
        localStorage.setItem("push_plataforma", plataforma);
        console.log("✅ Token push salvo no SGOS:", plataforma, String(token).substring(0, 25) + "...");
    } catch(err){
        console.error("Erro ao salvar token push:", err);
    }
}

function escapeHTML(valor){
    return String(valor ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function valorSeguro(v, fallback="-"){
    const t = String(v ?? "").trim();
    return t && t !== "[object Object]" ? escapeHTML(t) : fallback;
}

}

function dataReferenciaOS(os){
    if(!os) return null;

    let valor = null;

    if(tab === "concluido"){

    }else if(tab === "ausente"){

    }else{
        valor = os.iniciado_em || os.agendamento || os.atualizado_em || os.criado_em;
    }

    if(!valor) return null;

    const d = new Date(valor);
    return Number.isNaN(d.getTime()) ? null : d;
}

function inicioDoDia(data){
    const d = new Date(data);
    d.setHours(0,0,0,0);
    return d;
}

function fimDoDia(data){
    const d = new Date(data);
    d.setHours(23,59,59,999);
    return d;
}

function dentroDoPeriodo(os){
    const data = dataReferenciaOS(os);
    if(!data) return periodoSelecionado === "30dias";

    const agora = new Date();
    let inicio;
    let fim = fimDoDia(agora);

    if(periodoSelecionado === "hoje"){
        inicio = inicioDoDia(agora);
    }else if(periodoSelecionado === "ontem"){
        const ontem = new Date(agora);
        ontem.setDate(ontem.getDate() - 1);
        inicio = inicioDoDia(ontem);
        fim = fimDoDia(ontem);
    }else if(periodoSelecionado === "7dias"){
        inicio = inicioDoDia(agora);
        inicio.setDate(inicio.getDate() - 6);
    }else{
        inicio = inicioDoDia(agora);
        inicio.setDate(inicio.getDate() - 29);
    }

    return data >= inicio && data <= fim;
}

async function blobParaJpeg(blob, nomeBase="foto"){
    if(!blob || !String(blob.type || "").startsWith("image/")){
        return new File([blob], nomeBase, {type: blob?.type || "application/octet-stream"});
    }

    try{
        const bitmap = await createImageBitmap(blob);
        const limite = 1920;
        let largura = bitmap.width;
        let altura = bitmap.height;

        if(largura > limite || altura > limite){
            const escala = Math.min(limite / largura, limite / altura);
            largura = Math.round(largura * escala);
            altura = Math.round(altura * escala);
        }

        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(bitmap, 0, 0, largura, altura);

        const jpegBlob = await new Promise((resolve, reject) => {
            canvas.toBlob(
                b => b ? resolve(b) : reject(new Error("Falha ao preparar imagem")),
                "image/jpeg",
                0.78
            );
        });

        return new File([jpegBlob], `${nomeBase.replace(/\.[^.]+$/, "")}.jpg`, {
            type:"image/jpeg",
            lastModified:Date.now()
        });
    }catch(err){
        console.warn("Não foi possível converter a imagem; enviando original.", err);
        return new File([blob], nomeBase, {type:blob.type || "application/octet-stream"});
    }
}

async function tirarFotoAgora(){
    const info = document.getElementById("arquivoSelecionadoInfo");

    try{
        const Camera = window.Capacitor?.Plugins?.Camera;

        if(!Camera || typeof Camera.getPhoto !== "function"){
            alert("A câmera nativa ainda não está disponível neste build. Use Selecionar anexo ou gere um novo build com o plugin Camera e as permissões do iOS.");
            return;
        }

        const foto = await Camera.getPhoto({
            quality:72,
            allowEditing:false,
            resultType:"uri",
            source:"camera",
            saveToGallery:false,
            correctOrientation:true
        });

        const caminho = foto?.webPath || foto?.path;
        if(!caminho){
            throw new Error("A câmera não retornou a foto.");
        }

        const resposta = await fetch(caminho);
        const blob = await resposta.blob();
        arquivoFotoPreparado = await blobParaJpeg(blob, `foto-os-${Date.now()}.jpg`);

        const tamanhoMb = arquivoFotoPreparado.size / (1024 * 1024);
        if(info){
            info.textContent = `Foto pronta • ${tamanhoMb.toFixed(1)} MB`;
        }
    }catch(err){
        console.error("Erro ao tirar foto:", err);
        const mensagem = String(err?.message || err || "");
        if(!/cancel|cancelled|canceled/i.test(mensagem)){
            alert("Não foi possível abrir ou preparar a câmera. Verifique as permissões do iPhone e atualize o build.");
        }
    }
}

async function prepararArquivoParaEnvio(){
    if(arquivoFotoPreparado){
        return arquivoFotoPreparado;
    }

    const arquivo = document.getElementById("foto")?.files?.[0];
    if(!arquivo) return null;

    if(arquivo.size > 20 * 1024 * 1024){
        throw new Error("O anexo deve ter no máximo 20 MB.");
    }

    if(String(arquivo.type || "").startsWith("image/")){
        return await blobParaJpeg(arquivo, arquivo.name || `foto-${Date.now()}.jpg`);
    }

    return arquivo;
}

function bloquearBotao(btn, bloqueado, textoTemporario="Enviando..."){
    if(!btn) return;
    if(bloqueado){
        btn.dataset.textoOriginal = btn.innerHTML;
        btn.innerHTML = textoTemporario;
        btn.classList.add("botao-carregando");
        btn.disabled = true;
    }else{
        btn.innerHTML = btn.dataset.textoOriginal || btn.innerHTML;
        btn.classList.remove("botao-carregando");
        btn.disabled = false;
    }
}
async function lerRespostaSegura(res){
    const texto = await res.text();
    if(!texto) return {};
    try{return JSON.parse(texto)}catch(e){return {mensagem:texto}}
}
async function enviarAcao(tipo, botao){
    if(!osSelecionada){ alert("Nenhuma OS selecionada"); return; }
    const osAtual = encontrarOS(osSelecionada);
    if(!osAtual){ alert("OS não encontrada"); return; }

    if(osAtual._tipo === "avulsa"){
        if(tipo !== "concluir"){ alert("Para OS Avulsa, use apenas Concluir."); return; }
        bloquearBotao(botao, true);
        try{
            const res = await apiFetch(`/api/os-avulsas/${osAtual.id}/status`,{
                method:"PUT",headers:{"Content-Type":"application/json","x-usuario-id":user.id},
                body:JSON.stringify({status:"concluido"}),credentials:"include"
            });
            const data = await lerRespostaSegura(res);
            if(!res.ok) throw new Error(data.erro || data.mensagem || `Erro HTTP ${res.status}`);
            alert("OS Avulsa concluída com sucesso");
            fecharModal(); await load();
        }catch(err){console.error(err);alert(err.message || "Erro ao concluir OS Avulsa")}
        finally{bloquearBotao(botao,false)}
        return;
    }

    const rotas = {
        ausente:`/api/ordens_servico/ausente/${osAtual.id}`,
        inviabilidade:`/api/ordens_servico/inviabilidade/${osAtual.id}`,
        concluir:`/api/ordens_servico/concluir/${osAtual.id}`
    };
    if(!rotas[tipo]) return;

    bloquearBotao(botao,true);
    try{
        const formData = new FormData();
        formData.append("observacao", document.getElementById("obs").value || "");
        const arquivo = await prepararArquivoParaEnvio();
        if(arquivo){
            formData.append("foto", arquivo, arquivo.name || `anexo-${Date.now()}`);
        }
        const controller = new AbortController();
        const timer = setTimeout(()=>controller.abort(), 60000);
        const res = await apiFetch(rotas[tipo],{
            method:"POST",
            headers:{"x-usuario-id":String(user.id),"Accept":"application/json"},
            body:formData,
            credentials:"include",
            cache:"no-store",
            signal:controller.signal
        });
        clearTimeout(timer);
        const data = await lerRespostaSegura(res);
        if(!res.ok) throw new Error(data.erro || data.mensagem || `Erro HTTP ${res.status}`);
        alert("OS atualizada com sucesso");
        fecharModal(); await load();
    }catch(err){
        console.error("Falha na ação da OS:",err);
        alert(err.name === "AbortError" ? "A operação demorou demais. Tente novamente." : (err.message || "Erro ao executar ação"));
    }finally{bloquearBotao(botao,false)}
}
async function abrirUrlExterna(url){
    try{
        const Browser = window.Capacitor?.Plugins?.Browser;
        if(Browser && typeof Browser.open === "function"){
            await Browser.open({url, presentationStyle:"popover"});
            return;
        }
    }catch(e){console.warn("Browser nativo indisponível",e)}
    const nova = window.open(url,"_blank","noopener,noreferrer");
    if(!nova) window.location.href = url;
}
function verAnexo(){
    const os = encontrarOS(osSelecionada);
    const caminho = obterAnexoOS(os);
    if(!os || !caminho){alert("Nenhum anexo encontrado");return}
    const url = /^https?:\/\//i.test(caminho) ? caminho : apiUrl(caminho);
    const limpa = url.split("?")[0].toLowerCase();
    const imagem = /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic|heif)$/.test(limpa);
    if(getPlataformaApp() === "ios" && !imagem){
        abrirUrlExterna(url);
        return;
    }
    abrirModalAnexo(url,os.id);
}
async function obterPosicaoAtual(){
    const plataforma = getPlataformaApp();

    try{
        const Geo = window.Capacitor?.Plugins?.Geolocation;

        if(Geo && typeof Geo.getCurrentPosition === "function"){
            let permissao = null;

            if(typeof Geo.checkPermissions === "function"){
                try{
                    permissao = await Geo.checkPermissions();
                }catch(e){
                    console.warn("Falha ao consultar permissão de localização:", e);
                }
            }

            const estadoAtual =
                permissao?.location ||
                permissao?.coarseLocation ||
                permissao?.permissions?.location;

            if(
                typeof Geo.requestPermissions === "function" &&
                estadoAtual !== "granted" &&
                estadoAtual !== "limited"
            ){
                permissao = await Geo.requestPermissions({
                    permissions:["location","coarseLocation"]
                });
            }

            const estadoFinal =
                permissao?.location ||
                permissao?.coarseLocation ||
                permissao?.permissions?.location;

            if(
                estadoFinal &&
                !["granted","limited"].includes(String(estadoFinal))
            ){
                throw new Error(
                    plataforma === "ios"
                        ? "Permita a localização em Ajustes > SGOS > Localização > Durante o Uso."
                        : "Permissão de localização não concedida."
                );
            }

            const posicao = await Geo.getCurrentPosition({
                enableHighAccuracy:true,
                timeout:30000,
                maximumAge:0
            });

            const latitude = Number(posicao?.coords?.latitude);
            const longitude = Number(posicao?.coords?.longitude);

            if(!Number.isFinite(latitude) || !Number.isFinite(longitude)){
                throw new Error("O GPS não retornou coordenadas válidas.");
            }

            return {latitude, longitude};
        }
    }catch(err){
        console.warn("Geolocalização nativa falhou:", err);

        if(
            /Ajustes|Permiss|permission/i.test(String(err?.message || err))
        ){
            throw err;
        }
    }

    return await new Promise((resolve,reject)=>{
        if(!navigator.geolocation){
            reject(new Error("GPS não suportado neste dispositivo."));
            return;
        }

        navigator.geolocation.getCurrentPosition(
            pos=>{
                const latitude = Number(pos.coords.latitude);
                const longitude = Number(pos.coords.longitude);

                if(!Number.isFinite(latitude) || !Number.isFinite(longitude)){
                    reject(new Error("O GPS não retornou coordenadas válidas."));
                    return;
                }

                resolve({latitude,longitude});
            },
            erro=>{
                let mensagem = "Não foi possível obter a localização.";

                if(erro.code === 1){
                    mensagem = plataforma === "ios"
                        ? "Permita a localização em Ajustes > SGOS > Localização > Durante o Uso."
                        : "Permissão de localização não concedida.";
                }else if(erro.code === 2){
                    mensagem = "Sinal de GPS indisponível. Ative a localização e tente em local aberto.";
                }else if(erro.code === 3){
                    mensagem = "O GPS demorou para responder. Tente novamente.";
                }

                reject(new Error(mensagem));
            },
            {
                enableHighAccuracy:true,
                timeout:30000,
                maximumAge:0
            }
        );
    });
}
async function pegarLocalizacao(botao){
    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    const osAtual = encontrarOS(osSelecionada);

    if(!osAtual){
        alert("OS não encontrada");
        return;
    }

    if(osAtual._tipo === "avulsa"){
        alert("Localização para OS Avulsa ainda não está disponível.");
        return;
    }

    bloquearBotao(botao,true,"Obtendo localização...");

    try{
        const coords = await obterPosicaoAtual();

        bloquearBotao(botao,true,"Enviando localização...");

        const res = await apiFetch(`/api/ordens_servico/localizacao/${osAtual.id}`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Accept":"application/json",
                "x-usuario-id":String(user.id)
            },
            body:JSON.stringify({
                latitude:coords.latitude,
                longitude:coords.longitude,
                lat:coords.latitude,
                lng:coords.longitude
            }),
            credentials:"include",
            cache:"no-store"
        });

        const data = await lerRespostaSegura(res);

        if(!res.ok){
            throw new Error(
                data.erro ||
                data.mensagem ||
                data.message ||
                `Erro HTTP ${res.status}`
            );
        }

        osAtual.latitude = coords.latitude;
        osAtual.longitude = coords.longitude;

        alert("📍 Localização enviada com sucesso!");

        const btnVerLoc = document.getElementById("btnVerLocalizacao");
        if(btnVerLoc){
            btnVerLoc.disabled = false;
            btnVerLoc.style.opacity = "1";
        }

    }catch(err){
        console.error("Erro ao obter/enviar localização:", err);
        alert(err?.message || "Erro ao enviar localização");
    }finally{
        bloquearBotao(botao,false);
    }
}
function visualizarLocalizacao(){
    const os = encontrarOS(osSelecionada);
    const c = obterCoordenadasOS(os);
    if(!c){alert("Sem localização registrada");return}
    abrirUrlExterna(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.latitude+","+c.longitude)}`);
}
