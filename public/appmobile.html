<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SGOS Técnico</title>

<style>
:root{
    --azul:#2563eb;
    --azul-dark:#081a31;
    --fundo:#f5f7fb;
    --card:#ffffff;
    --texto:#0f172a;
    --muted:#64748b;
    --borda:#e5e7eb;
    --verde:#16a34a;
    --laranja:#f59e0b;
    --vermelho:#ef4444;
    --whatsapp:#25D366;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html, body{
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--fundo);
    color:var(--texto);
    min-height:100vh;
    min-height:100dvh;
    padding-top:0;
    padding-bottom:calc(env(safe-area-inset-bottom) + 6px);
}

/* ================= HEADER ================= */

.header{
    background:#fff;
    color:#0f172a;
    padding:16px;
    border-bottom:1px solid #e5e7eb;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.empresa-box{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px 0;
    background:#fff;
}

.logo-empresa{
    max-height:70px;
    width:auto;
    object-fit:contain;
}

#nomeEmpresa{
    font-size:12px;
    color:#cbd5e1;
}

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:14px;
}

.user-box{
    color:#0f172a;
    font-weight:600;
    font-size:15px;
}

#user{
    font-weight:800;
}

.logout{
    background:#ef4444;
    border:none;
    color:white;
    padding:9px 13px;
    border-radius:999px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(239,68,68,.25);
}

/* ================= BUSCA ================= */

.busca{
    padding:14px 12px 6px;
}

.busca input{
    width:100%;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid var(--borda);
    background:white;
    color:var(--texto);
    font-size:14px;
    outline:none;
    box-shadow:0 8px 20px rgba(15,23,42,.05);
}

.busca input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* ================= CARDS STATUS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px 12px 12px;
}

.card{
    min-height:74px;
    padding:12px 8px;
    border-radius:16px;
    color:white;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 10px 22px rgba(15,23,42,.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:12px;
    font-weight:800;
}

.card span{
    font-size:25px;
    line-height:1;
}

.andamento{
    background:linear-gradient(135deg,#f59e0b,#f97316);
}

.concluido{
    background:linear-gradient(135deg,#16a34a,#22c55e);
}

.ausente{
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.active{
    transform:translateY(-2px) scale(1.02);
    outline:3px solid rgba(37,99,235,.18);
}

.andamento.active{ box-shadow:0 0 0 3px rgba(245,158,11,.18), 0 12px 28px rgba(245,158,11,.25); }
.concluido.active{ box-shadow:0 0 0 3px rgba(34,197,94,.18), 0 12px 28px rgba(34,197,94,.25); }
.ausente.active{ box-shadow:0 0 0 3px rgba(239,68,68,.18), 0 12px 28px rgba(239,68,68,.25); }

/* ================= LISTA OS ================= */

.container{
    padding:4px 12px 18px;
}

.container > p{
    background:white;
    border:1px solid var(--borda);
    border-radius:16px;
    padding:28px 16px;
    text-align:center;
    color:var(--muted);
    font-weight:800;
    box-shadow:0 8px 22px rgba(15,23,42,.04);
}

.os{
    background:white;
    border:1px solid var(--borda);
    padding:15px 14px 62px;
    border-radius:18px;
    margin-bottom:12px;
    cursor:pointer;
    position:relative;
    box-shadow:0 10px 24px rgba(15,23,42,.06);
    font-size:13px;
    line-height:1.6;
    color:#334155;
    overflow:hidden;
}

.os:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:5px;
    height:100%;
    background:var(--azul);
}

.os b{
    color:#0f172a;
}

.os > b:first-of-type{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:6px;
}

.data-right{
    position:absolute;
    right:12px;
    top:14px;
    max-width:48%;
    text-align:right;
    font-size:11px;
    color:#64748b;
    font-weight:800;
    line-height:1.3;
}

.btn-whatsapp{
    position:absolute;
    right:12px;
    bottom:12px;
    width:46px;
    height:46px;
    border-radius:50%;
    border:none;
    background:var(--whatsapp);
    color:white;
    font-size:21px;
    box-shadow:0 10px 22px rgba(37,211,102,.28);
    cursor:pointer;
}


.badge-avulsa{
    display:inline-block;
    background:#fef3c7;
    color:#92400e;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    margin-left:6px;
}

.sva-card{
    margin-top:10px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:14px;
    padding:10px;
    color:#1e3a8a;
    line-height:1.55;
}

.sva-card b{
    color:#1e3a8a;
}

.resumo-modal-os{
    background:#f8fafc;
    border:1px solid var(--borda);
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
    font-size:13px;
    line-height:1.55;
    color:#334155;
}

.resumo-modal-os h4{
    margin:0 0 8px;
    color:#0f172a;
    font-size:15px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(15,23,42,.72);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:9999;
    padding:16px;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:22px 22px 18px 18px;
    width:100%;
    max-width:460px;
    max-height:92dvh;
    overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
    animation:modalUp .18s ease-out;
}

@keyframes modalUp{
    from{ transform:translateY(20px); opacity:.4; }
    to{ transform:translateY(0); opacity:1; }
}

.modal-content h3{
    margin:0 0 14px;
    color:#0f172a;
    font-size:20px;
    text-align:center;
}

.modal input,
.modal textarea{
    width:100%;
    margin:6px 0 10px;
    padding:12px;
    border:1px solid var(--borda);
    border-radius:12px;
    outline:none;
    font-size:14px;
    background:#fff;
}

.modal textarea{
    min-height:95px;
    resize:vertical;
}

.modal input:focus,
.modal textarea:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.modal button{
    width:100%;
    margin:6px 0;
    padding:12px;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
}

.btn-ausente{
    background:#f59e0b;
}

.btn-inv{
    background:#ef4444;
}

.btn-ok{
    background:#16a34a;
}

.btn-loc{
    background:#0f172a;
}

.modal button:last-child{
    background:#64748b;
}



/* ================= MODAL VISUALIZAR ANEXO ================= */
.modal-anexo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(15,23,42,.78);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
    padding:14px;
}

.modal-anexo-content{
    width:100%;
    max-width:520px;
    height:88dvh;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.38);
    animation:modalUp .18s ease-out;
}

.modal-anexo-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--borda);
    background:#fff;
}

.modal-anexo-header strong{
    font-size:15px;
    color:#0f172a;
}

.btn-fechar-anexo{
    width:38px;
    height:38px;
    border:none;
    border-radius:12px;
    background:#ef4444;
    color:#fff;
    font-size:22px;
    font-weight:900;
    line-height:1;
    cursor:pointer;
}

.anexo-viewer{
    flex:1;
    background:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
}

.anexo-viewer iframe{
    width:100%;
    height:100%;
    border:0;
    background:#fff;
}

.anexo-viewer img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
}

.anexo-msg{
    color:#fff;
    text-align:center;
    padding:18px;
    font-weight:800;
}


/* ================= TOAST NOVA OS ================= */

.toast-os{
    position:fixed;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    background:#ef4444;
    color:#fff;
    padding:16px 22px;
    border-radius:16px;
    font-weight:800;
    font-size:16px;
    z-index:999999;
    box-shadow:0 14px 34px rgba(239,68,68,.35);
    transition:.35s;
    opacity:0;
    text-align:center;
    width:calc(100% - 32px);
    max-width:420px;
}

.toast-os.show{
    top:18px;
    opacity:1;
}


/* ================= MENU LATERAL MOBILE ================= */
.mobile-topbar-app{
    min-height:72px;
    height:auto;
    background:#fff;
    border-bottom:1px solid var(--borda);
    display:flex;
    align-items:center;
    gap:12px;
    padding-top:calc(env(safe-area-inset-top) + 8px);
    padding-right:14px;
    padding-bottom:10px;
    padding-left:14px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.menu-btn{width:42px;height:42px;border:none;border-radius:12px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.18);flex:0 0 auto;}
.menu-btn span{display:block;width:20px;height:2px;background:#fff;position:relative;border-radius:99px;}
.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0;width:20px;height:2px;background:#fff;border-radius:99px;}
.menu-btn span:before{top:-7px}.menu-btn span:after{top:7px}
.topbar-title{min-width:0;flex:1}.topbar-title strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar-title small{display:block;color:#64748b;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1999;opacity:0;pointer-events:none;transition:.25s;}.drawer-overlay.show{opacity:1;pointer-events:auto;}
.side-drawer{position:fixed;left:0;top:0;height:100dvh;width:280px;max-width:82vw;background:linear-gradient(180deg,#081a31,#061426);z-index:2000;transform:translateX(-100%);transition:.25s ease;color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;box-shadow:18px 0 45px rgba(0,0,0,.32);}
.side-drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.drawer-head img{width:148px;max-height:58px;object-fit:contain}.drawer-close{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:22px}
.drawer-user{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:14px}.drawer-user strong{display:block;font-size:14px}.drawer-user small{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}
.drawer-nav{display:flex;flex-direction:column;gap:7px}.drawer-nav a{color:#dbeafe;text-decoration:none;display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;font-size:15px;font-weight:800}.drawer-nav a.active,.drawer-nav a:hover{background:#2563eb;color:#fff}.drawer-nav .ico{width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}.drawer-footer{margin-top:auto}.drawer-logout{width:100%;border:none;background:#ef4444;color:#fff;border-radius:14px;padding:13px;font-weight:900;font-size:14px}
.header{position:relative;z-index:1;}

/* ================= RESPONSIVO ================= */

@media(min-width:760px){
    body{
        max-width:520px;
        margin:0 auto;
        background:#e5e7eb;
    }

    .header{
        margin-top:10px;
        border-radius:24px;
    }
}

@media(max-width:360px){
    .cards{
        gap:7px;
    }

    .card{
        font-size:11px;
        padding:10px 6px;
    }

    .card span{
        font-size:22px;
    }

    .user-box{
        font-size:12px;
        max-width:220px;
    }
}
</style>

</head>

<script>

/* ================= API BASE LOCAL/REMOTO ================= */
function getApiBase(){
    const salvo = localStorage.getItem("api_base");
    if(salvo) return salvo.replace(/\/$/, "");

    const provedor = localStorage.getItem("provedor");
    if(provedor) return `https://${provedor}.sgos.net.br`;

    if(location.protocol.startsWith("http")){
        return location.origin;
    }

    return "";
}

function apiUrl(path){
    if(!path) return getApiBase();

    if(/^https?:\/\//i.test(path)){
        return path;
    }

    const base = getApiBase();

    if(!base){
        return path;
    }

    return base + (path.startsWith("/") ? path : "/" + path);
}

function apiFetch(path, options = {}){
    return fetch(apiUrl(path), options);
}

function getPlataformaApp(){
    try{
        if(window.Capacitor && typeof window.Capacitor.getPlatform === "function"){
            return window.Capacitor.getPlatform();
        }
    }catch(e){}
    return "web";
}

function formatarTelefoneApp(valor){
    try{
        if(!valor) return "-";

        if(Array.isArray(valor)){
            const item = valor.find(v => v && (v.contato || v.telefone || v.numero || v.celular)) || valor[0];
            return formatarTelefoneApp(item);
        }

        if(typeof valor === "object"){
            return valor.contato || valor.telefone || valor.numero || valor.celular || valor.whatsapp || "-";
        }

        const texto = String(valor).trim();
        return texto && texto !== "[object Object]" ? texto : "-";
    }catch(e){
        return "-";
    }
}

function getFirebaseMessagingPlugin(){
    try{
        const cap = window.Capacitor;
        return cap?.Plugins?.FirebaseMessaging ||
               cap?.Plugins?.CapacitorFirebaseMessaging ||
               window.FirebaseMessaging ||
               null;
    }catch(e){
        console.warn("Erro ao localizar FirebaseMessaging:", e);
        return null;
    }
}

async function registrarFcmIos(){
    const plataforma = getPlataformaApp();
    if(plataforma !== "ios") return false;

    const FirebaseMessaging = getFirebaseMessagingPlugin();
    if(!FirebaseMessaging){
        console.warn("FirebaseMessaging não encontrado no iOS; não será salvo token APNs como FCM.");
        return false;
    }

    try{
        if(typeof FirebaseMessaging.requestPermissions === "function"){
            const perm = await FirebaseMessaging.requestPermissions();
            console.log("Permissão FirebaseMessaging iOS:", perm);
        }

        if(typeof FirebaseMessaging.getToken !== "function"){
            console.warn("FirebaseMessaging.getToken não disponível.");
            return false;
        }

        const result = await FirebaseMessaging.getToken();
        const fcmToken = result?.token || result?.value || result;

        if(!fcmToken){
            console.warn("FirebaseMessaging não retornou token FCM.", result);
            return false;
        }

        console.log("✅ TOKEN FCM IOS RECEBIDO:", String(fcmToken).substring(0, 40) + "...");
        await salvarTokenPush(String(fcmToken), "ios");
        return true;
    }catch(err){
        console.error("Erro ao obter token FCM iOS:", err);
        return false;
    }
}

function carregarSocketIo(){
    return new Promise((resolve) => {
        if(typeof io === "function"){
            resolve(true);
            return;
        }

        const script = document.createElement("script");
        script.src = apiUrl("/socket.io/socket.io.js");
        script.onload = () => resolve(true);
        script.onerror = () => {
            console.warn("Não foi possível carregar Socket.IO remoto");
            resolve(false);
        };
        document.head.appendChild(script);
    });
}


function abrirMenu(){
    document.getElementById("sideDrawer")?.classList.add("open");
    document.getElementById("drawerOverlay")?.classList.add("show");
}
function fecharMenu(){
    document.getElementById("sideDrawer")?.classList.remove("open");
    document.getElementById("drawerOverlay")?.classList.remove("show");

// =========================
const params =
new URLSearchParams(
    window.location.search
);

const token =
params.get("token");

const id =
params.get("id");

const app =
params.get("app");

const provedorParam = params.get("provedor");
if(provedorParam){

const osPushId = params.get("os_id") || params.get("os") || params.get("id_os");

// =========================
// RECEBE LOGIN APK
// =========================
if(token && id){

    // IMPORTANTE:
    // No app Android/iOS o WebView pode reabrir a última URL usada.
    // Se a URL antiga ainda tiver ?token=...&id=..., ela sobrescreve o login atual.
    // Por isso salvamos a sessão NOVA sem reaproveitar usuário antigo e limpamos a URL.

    const novoUsuarioApp = {
        id: String(id),
        log_id: String(token),
        usuario: params.get("usuario") || "",
        empresa_id: params.get("empresa_id") || params.get("empresaId") || "",
        empresa_nome: params.get("empresa_nome") || "",
        empresa_logo: params.get("empresa_logo") || ""
    };

    localStorage.setItem("usuario", JSON.stringify(novoUsuarioApp));
    localStorage.setItem("log_id", String(token));
    localStorage.setItem("usuario_id", String(id));
    localStorage.setItem("is_app", "1");

    const provedorSessao = params.get("provedor") || localStorage.getItem("provedor") || "";

    if(provedorSessao){
        localStorage.setItem("provedor", provedorSessao);
        localStorage.setItem("api_base", `https://${provedorSessao}.sgos.net.br`);
    }

    localStorage.setItem("sessao_app", JSON.stringify({
        provedor: provedorSessao,
        id: String(id),
        log_id: String(token),
        usuario: params.get("usuario") || "",
        empresa_id: params.get("empresa_id") || params.get("empresaId") || ""
    }));

    // Remove token/id da barra para o app não restaurar login antigo ao fechar e abrir.
    try{
        const limpa = new URL(window.location.href);
        limpa.searchParams.delete("token");
        limpa.searchParams.delete("id");
        limpa.searchParams.delete("usuario");
        limpa.searchParams.delete("empresa_id");
        limpa.searchParams.delete("empresaId");
        limpa.searchParams.delete("empresa_nome");
        limpa.searchParams.delete("empresa_logo");
        limpa.searchParams.delete("provedor");

        if(!limpa.searchParams.get("app")){
            limpa.searchParams.set("app", "1");
        }

        window.history.replaceState({}, document.title, limpa.pathname + limpa.search + limpa.hash);
    }catch(e){
        console.warn("Não foi possível limpar parâmetros de login da URL", e);
    }

    console.log("✅ sessão nova recebida APK", { id, token });

}

function normalizarStatusApp(status){
    const s = String(status || "").toLowerCase().trim();

    if(s.includes("andamento") || s.includes("exec")) return "em_andamento";
    if(s.includes("concl") || s.includes("final")) return "concluido";
    if(s.includes("ausente")) return "cliente_ausente";
    if(s.includes("abert")) return "aberto";
    if(s.includes("agend")) return "agendado";

    return s.replace(/\s+/g, "_");
}

function enderecoAvulsaLimpo(os){
    const texto = String(os.endereco || os.rua || "").trim();

    if(!texto) return "-";

    const idx = texto.toUpperCase().indexOf("CLIENTES:");
    if(idx >= 0){
        return texto.slice(0, idx).replace(/[,;\-\s]+$/g, "").trim() || "-";
    }

    return texto;
}

function descricaoAvulsaLimpa(os){
    const texto = String(os.descricao || os.observacao || os.referencia || "").trim();
    const endereco = String(os.endereco || os.rua || "").trim();

    let base = texto;

    const idxEnd = endereco.toUpperCase().indexOf("CLIENTES:");
    if(idxEnd >= 0){
        base = endereco.slice(idxEnd).trim();
    }

    const idx = base.toUpperCase().indexOf("CLIENTES:");
    if(idx >= 0){
        base = base.slice(idx).trim();
    }

    return base || "-";
}

function enderecoNormal(os){
    const partes = [];
    if(os.rua) partes.push(os.rua);
    if(os.n) partes.push(os.n);
    if(os.referencia) partes.push(os.referencia);
    if(os.bairro) partes.push(`(${os.bairro})`);

    return partes.join(", ").replace(", (", " (") || "-";
}

/* ================= SOCKET.IO REALTIME ================= */
function iniciarSocket(){
    try {
        if(socketConectado) return;
        if(typeof io !== "function"){
            console.warn("Socket.IO não carregado no appmobile.html");
            return;
        }

        socket = io(getApiBase(), {
            transports:["websocket", "polling"]
        });

        socket.on("connect", () => {
            console.log("✅ Socket conectado:", socket.id);
            socketConectado = true;

            if(user?.id && user?.empresa_id){
                socket.emit("join", {
                    id:user.id,
                    usuario:user.usuario || user.nome || "Técnico",
                    empresa_id:user.empresa_id
                });
            }
        });

        socket.on("disconnect", () => {
            console.warn("Socket desconectado");
            socketConectado = false;
        });

        socket.on("os_update", () => {
            console.log("🔄 os_update recebido via socket");
            load();
        });

        socket.on("nova_os", () => {
            console.log("🚨 nova_os recebido via socket");
            load();
        });

        socket.on("os_andamento", (data) => {
            console.log("🚀 os_andamento recebido via socket", data);

            mostrarNotificacaoCustom(
                data?.titulo || "🚀 NOVA OS LANÇADA!",
                data?.mensagem || "Uma OS entrou em andamento"
            );

            load();
        });

    } catch(err){
        console.error("Erro ao iniciar Socket.IO:", err);
    }
}

let idsJaCarregados = new Set();

async function load(){

    if(!user.id){
        console.error("Sem user.id");
        return;
    }

    try {

        const res = await apiFetch(API_PATH, {
            headers: {
                "x-usuario-id": user.id
            }
        });

        const listaNormal = await res.json();

        let listaAvulsas = [];

        try {
            const resAvulsas = await apiFetch("/api/os-avulsas/painel?periodo=30dias", {
                headers: {
                    "x-usuario-id": user.id
                }
            });

            if(resAvulsas.ok){
                listaAvulsas = await resAvulsas.json();
            }
        } catch(errAvulsa){
            console.warn("Não foi possível carregar OS Avulsas no app:", errAvulsa);
        }

        const novaLista = [
            ...(Array.isArray(listaNormal) ? listaNormal.map(normalizarOSNormal) : []),
            ...(Array.isArray(listaAvulsas) ? listaAvulsas.map(normalizarOSAvulsa) : [])
        ];

        // =========================
        // DETECTA NOVAS OS
        // =========================
        const novosIds = [];

        novaLista.forEach(os => {

            // primeira vez NÃO notifica
            if(primeiraCarga){
                idsJaCarregados.add(chaveOS(os));
                return;
            }

            // nova OS encontrada
            if(!idsJaCarregados.has(chaveOS(os))){

                idsJaCarregados.add(chaveOS(os));

                novosIds.push(chaveOS(os));

            }

        });

        // remove ids inexistentes
        const idsAtuais =
        new Set(novaLista.map(o => chaveOS(o)));

        idsJaCarregados.forEach(id => {

            if(!idsAtuais.has(id)){
                idsJaCarregados.delete(id);
            }

        });

        // =========================
        // NOTIFICA
        // =========================
        if(novosIds.length > 0){

            tocarSomNovaOS();

            mostrarNotificacao(novosIds.length);

            console.log(
                "Nova OS detectada:",
                novosIds
            );

        }

        primeiraCarga = false;

        OS = novaLista;

        abrirOSDaNotificacaoSeExistir();

    } catch (e){

        console.error(
            "Erro ao carregar OS:",
            e
        );

        OS = [];
    }

    render();
}

/* ================= RENDER ================= */
function render(){

    const inputBusca = document.getElementById("busca");
    const busca = inputBusca ? inputBusca.value.toLowerCase() : "";

    const norm = s => (s||"").toLowerCase();

    const filtrado = OS.filter(o => {

        const matchBusca =
            String(o.id).includes(busca) ||
            norm(o.nome).includes(busca);

        const matchStatus =
            (tab === "andamento" && norm(o.status).includes("andamento")) ||
            (tab === "concluido" && norm(o.status).includes("concluido")) ||
            (tab === "ausente" && norm(o.status).includes("ausente"));

        return matchBusca && matchStatus;
    });

    // CONTADORES
    document.getElementById("cA").innerText =
        OS.filter(o => norm(o.status).includes("andamento")).length;

    document.getElementById("cC").innerText =
        OS.filter(o => norm(o.status).includes("concluido")).length;

    document.getElementById("cX").innerText =
        OS.filter(o => norm(o.status).includes("ausente")).length;

    // ATIVO
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    const activeCard = document.querySelector("." + tab);
    if(activeCard) activeCard.classList.add("active");

    const el = document.getElementById("lista");

    if(!filtrado.length){
        el.innerHTML = "<p>Nenhuma OS</p>";

    el.innerHTML = filtrado.map(o => {

        let dataTopo = "";

        // ANDAMENTO / AUSENTE

            <b>Iniciado por:</b> ${o.enviado_por_nome || o.iniciado_por || '-'}<br>
            <b>Finalizado por:</b> ${o.finalizado_por_nome || o.finalizado_por || '-'}<br>

async function enviarAcao(tipo){

    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    const osAtual = encontrarOS(osSelecionada);

    if(!osAtual){
        alert("OS não encontrada");
        return;
    }

    if(osAtual._tipo === "avulsa"){
        if(tipo !== "concluir"){
            alert("Para OS Avulsa, use apenas a ação Concluir no app.");
            return;
        }

        try{
            const res = await apiFetch(`/api/os-avulsas/${osAtual.id}/status`, {
                method:"PUT",
                headers:{
                    "Content-Type":"application/json",
                    "x-usuario-id": user.id
                },
                body:JSON.stringify({ status:"concluido" })
            });

            const data = await res.json().catch(() => ({}));

            if(!res.ok){
                throw new Error(data.erro || "Erro ao concluir OS Avulsa");
            }

            alert("OS Avulsa concluída com sucesso");
            fecharModal();
            load();
            return;

        }catch(err){
            console.error(err);
            alert("Erro ao concluir OS Avulsa");
            return;
        }
    }

    try {

        const obs = document.getElementById("obs").value;

        const fotoInput = document.getElementById("foto");

        const formData = new FormData();

        formData.append("observacao", obs);

        if(fotoInput.files[0]){
            formData.append("foto", fotoInput.files[0]);
        }

        let rota = "";
        const osIdAcao = osAtual.id;

        if(tipo === "ausente"){
            rota = `/api/ordens_servico/ausente/${osIdAcao}`;
        }

        if(tipo === "inviabilidade"){
            rota = `/api/ordens_servico/inviabilidade/${osIdAcao}`;
        }

        if(tipo === "concluir"){
            rota = `/api/ordens_servico/concluir/${osIdAcao}`;
        }

        const res = await apiFetch(rota, {
            method: "POST",
            headers: {
                "x-usuario-id": user.id
            },
            body: formData
        });

        const data = await res.json();

        if(!res.ok){
            throw new Error(data.erro || "Erro");
        }

        alert("OS atualizada com sucesso");

        fecharModal();

        load();

    } catch(err){

        console.error(err);

        alert("Erro ao executar ação");
    }
}

/* ================= VER ANEXO ================= */
function verAnexo(){

    const os = encontrarOS(osSelecionada);

    if(!os || !os.anexo_path){
        alert("Nenhum anexo encontrado");
        return;
    }

    const url = os.anexo_path.startsWith("http")
        ? os.anexo_path
        : getApiBase() + os.anexo_path;

    abrirModalAnexo(url, os.id);
}

function abrirModalAnexo(url, osId){

    const modalAnexo = document.getElementById("modalAnexo");
    const viewer = document.getElementById("anexoViewer");
    const titulo = document.getElementById("tituloAnexo");

    if(!modalAnexo || !viewer){
        window.open(url, "_blank");
        return;
    }

    const urlLimpa = url.split("?")[0].toLowerCase();
    const isImagem = /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/.test(urlLimpa);

    if(titulo){
        titulo.innerText = osId ? `📎 Anexo da OS #${osId}` : "📎 Visualizar Anexo";
    }

    if(isImagem){
        viewer.innerHTML = `<img src="${url}" alt="Anexo da OS" onerror="this.outerHTML='<div class=&quot;anexo-msg&quot;>Não foi possível carregar este anexo.</div>'">`;
    }else{
        viewer.innerHTML = `<iframe src="${url}" title="Anexo da OS"></iframe>`;
    }

    modalAnexo.style.display = "flex";
}

function fecharModalAnexo(){

    const modalAnexo = document.getElementById("modalAnexo");
    const viewer = document.getElementById("anexoViewer");

    if(modalAnexo){
        modalAnexo.style.display = "none";
    }

    if(viewer){
        viewer.innerHTML = `<div class="anexo-msg">Carregando anexo...</div>`;
    }
}

/* ================= LOCALIZAÇÃO ================= */
async function pegarLocalizacao(){

    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    const osAtual = encontrarOS(osSelecionada);
    if(osAtual && osAtual._tipo === "avulsa"){
        alert("Localização para OS Avulsa ainda não está disponível no app.");
        return;
    }

    if(!navigator.geolocation){
        alert("GPS não suportado neste dispositivo");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        try {

            const res = await apiFetch(`/api/ordens_servico/localizacao/${osAtual.id}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-usuario-id": user.id
                },
                body: JSON.stringify({
    latitude: lat,
    longitude: lng
})
            });

            const data = await res.json();

            if(!res.ok){
                throw new Error(data.erro || "Erro ao salvar localização");
            }

            alert("📍 Localização enviada com sucesso!");

        } catch (err){
            console.error(err);
            alert("Erro ao enviar localização");
        }

    }, () => {
        alert("Não foi possível obter GPS");
    });

}

function visualizarLocalizacao(){

    const os = encontrarOS(osSelecionada);

    if(!os){
        alert("OS não encontrada");
        return;
    }

    if(!os.latitude || !os.longitude){
        alert("Sem localização registrada");
        return;
    }

    const url = `https://www.google.com/maps?q=${os.latitude},${os.longitude}`;

    window.open(url, "_blank");
}

/* ================= LOGOUT ================= */
function logout(){

    console.log("is_app =", localStorage.getItem("is_app"));

    const logId = localStorage.getItem("log_id");

    if(logId){
        apiFetch("/api/logout", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ log_id: logId })
        }).catch(console.error);
    }

    // Limpa sessão web completa
    try{ sessionStorage.clear(); }catch(e){}
    try{ localStorage.clear(); }catch(e){}

    // Limpa sessão salva no app nativo, se existir bridge Android/iOS.
    // Mantém compatibilidade mesmo se o método ainda não existir no app.
    try{
        if(window.SGOSAndroid){
            if(typeof window.SGOSAndroid.limparUsuarioId === "function"){
                window.SGOSAndroid.limparUsuarioId();
            }
            if(typeof window.SGOSAndroid.salvarUsuarioId === "function"){
                window.SGOSAndroid.salvarUsuarioId("");
            }
            if(typeof window.SGOSAndroid.logout === "function"){
                window.SGOSAndroid.logout();
            }
        }
    }catch(e){
        console.warn("Não foi possível limpar sessão nativa", e);
    }

    // Vai para a tela de login sem token/id antigo.
    window.location.replace("index.html?logout=1&t=" + Date.now());
}

/* ================= PUSH NOTIFICATION REAL - CAPACITOR / ANDROID NATIVO ================= */
let pushRegistrado = false;

function getPushPlugin(){
    try {
        const cap = window.Capacitor;

        console.log("Capacitor disponível:", !!cap);
        console.log("Plataforma:", getPlataformaApp());
        console.log("Plugins disponíveis:", cap?.Plugins ? Object.keys(cap.Plugins) : []);

        if(cap?.Plugins?.PushNotifications){
            return cap.Plugins.PushNotifications;
        }

        if(cap?.Plugins?.PushNotificationsPlugin){
            return cap.Plugins.PushNotificationsPlugin;
        }

        if(window.PushNotifications){
            return window.PushNotifications;
        }

        return null;
    } catch(e){
        console.error("Erro ao localizar plugin PushNotifications:", e);
        return null;
    }
}

function getDeviceIdPush(plataforma = getPlataformaApp()){
    let deviceId = localStorage.getItem("device_id");

    if(!deviceId){
        deviceId = `${plataforma || "app"}-${user?.id || "user"}-${Date.now()}`;
        localStorage.setItem("device_id", deviceId);
    }

    return deviceId;
}

async function salvarTokenPush(token, plataformaInformada){
    if(!token){
        console.warn("Token push vazio");
        return;
    }

    if(!user || !user.id){
        console.warn("Usuário não carregado; não foi possível salvar token push");
        return;
    }

    let plataforma = plataformaInformada || getPlataformaApp();

    // Mantém compatibilidade com o Android antigo que já funcionava.
    if(window.SGOSAndroid){
        plataforma = "android";
    }

    try {
        const res = await apiFetch("/api/push/token", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "x-usuario-id": user.id
            },
            body:JSON.stringify({
                token_fcm: String(token),
                plataforma: plataforma,
                device_id: getDeviceIdPush(plataforma)
            })
        });

        const data = await res.json().catch(() => ({}));

        if(!res.ok){
            throw new Error(data.erro || "Erro ao salvar token push");
        }

        localStorage.setItem("push_token_fcm", String(token));
        localStorage.setItem("push_plataforma", plataforma);
        console.log("✅ Token push salvo no SGOS:", plataforma, String(token).substring(0, 25) + "...");
    } catch(err){
        console.error("Erro ao salvar token push:", err);
    }
}

// Funções globais para compatibilidade com Android nativo.
// Assim mantemos compatibilidade com nomes diferentes usados em versões antigas do APK.
async function receberTokenPushAndroid(token){
    console.log("📲 Token recebido do Android nativo");
    await salvarTokenPush(token, "android");
}

window.salvarTokenPushAndroid = receberTokenPushAndroid;
window.SGOSSalvarTokenPushAndroid = receberTokenPushAndroid;
window.salvarTokenFCM = receberTokenPushAndroid;
window.registrarTokenFCM = receberTokenPushAndroid;
window.receberTokenFCM = receberTokenPushAndroid;
window.onFcmToken = receberTokenPushAndroid;
window.onFirebaseToken = receberTokenPushAndroid;

async function iniciarPush(){
    console.log("========== INICIANDO PUSH ==========");

    if(pushRegistrado){
        console.log("Push já registrado nesta sessão");
        return;
    }

    const plataforma = getPlataformaApp();
    const PushNotifications = getPushPlugin();

    console.log("PushNotifications plugin:", PushNotifications);

    // Se não existir plugin Capacitor mas existir bridge Android, deixa o nativo cuidar do FCM.
    if(!PushNotifications){
        if(window.SGOSAndroid){
            console.log("Push Capacitor não encontrado; usando bridge Android nativo, se disponível.");
            registrarUsuarioAndroidNativo();
            return;
        }

        console.warn("Push Capacitor não encontrado. Ficará apenas socket/polling + Notification API.");
        return;
    }

    pushRegistrado = true;

    try {
        await PushNotifications.addListener("registration", async (token) => {
            console.log("TOKEN APNS RECEBIDO:", token.value);

            if(plataforma === "ios"){
                // No iOS, o token do PushNotifications é APNs.
                // Para enviar via Firebase Admin precisamos salvar o FCM Token.
                const okFcm = await registrarFcmIos();
                if(!okFcm){
                    console.warn("Token APNs recebido, mas FCM iOS não foi obtido. Não salvando APNs como FCM.");
                }
                return;
            }

            console.log("✅ Token Push Capacitor:", token.value);
            await salvarTokenPush(token.value, plataforma);
        });

        await PushNotifications.addListener("registrationError", (err) => {
            console.error("Erro no registro push:", err);
        });

        await PushNotifications.addListener("pushNotificationReceived", (notification) => {
            console.log("Push recebido com app aberto:", notification);

            tocarSomNovaOS();
            if(navigator.vibrate) navigator.vibrate([300,100,300]);

            const osId = notification?.data?.os_id || notification?.data?.id_os || notification?.data?.id;

            if(osId){
                localStorage.setItem("abrir_os_push", String(osId));
                load();
            }else{
                mostrarNotificacao(1);
            }
        });

        await PushNotifications.addListener("pushNotificationActionPerformed", (event) => {
            console.log("Notificação tocada:", event);

            const data = event?.notification?.data || {};
            const osId = data.os_id || data.id_os || data.id;

            if(osId){
                localStorage.setItem("abrir_os_push", String(osId));
                window.location.href = `appmobile.html?app=1&os_id=${encodeURIComponent(osId)}`;
            }else{
                window.location.href = "appmobile.html?app=1";
            }
        });

        let permissaoAntes = null;
        try {
            if (typeof PushNotifications.checkPermissions === "function") {
                permissaoAntes = await PushNotifications.checkPermissions();
                console.log("Permissões antes:", permissaoAntes);
            }
        } catch(e) {
            console.warn("Erro ao consultar permissões antes:", e);        }

        const perm = await PushNotifications.requestPermissions();
        console.log("Permissão push:", perm);

        let permissaoDepois = null;
        try {
            if (typeof PushNotifications.checkPermissions === "function") {
                permissaoDepois = await PushNotifications.checkPermissions();
                console.log("Permissões depois:", permissaoDepois);
            }
        } catch(e) {
            console.warn("Erro ao consultar permissões depois:", e);        }

        if(perm.receive !== "granted"){
            console.warn("Permissão de push negada pelo usuário");
            pushRegistrado = false;
            return;
        }

        await PushNotifications.register();
        console.log("✅ PushNotifications.register() executado");

        if(plataforma === "ios"){
            // Em alguns builds o token FCM fica disponível logo após o register.
            setTimeout(() => registrarFcmIos(), 1200);
        }

    } catch(err){
        console.error("Erro ao iniciar push:", err);
        pushRegistrado = false;
    }
}

function abrirOSDaNotificacaoSeExistir(){
