<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGOS Técnico</title>

<style>
:root{
    --azul:#2563eb;
    --azul-dark:#081a31;
    --fundo:#f5f7fb;
    --card:#ffffff;
    --texto:#0f172a;
    --muted:#64748b;
    --borda:#e5e7eb;
    --verde:#16a34a;
    --laranja:#f59e0b;
    --vermelho:#ef4444;
    --whatsapp:#25D366;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--fundo);
    color:var(--texto);
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    background:#fff;
    color:#0f172a;
    padding:16px;
    border-bottom:1px solid #e5e7eb;
    box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.empresa-box{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px 0;
    background:#fff;
}

.logo-empresa{
    max-height:60px;
    width:auto;
    object-fit:contain;
}

#nomeEmpresa{
    font-size:12px;
    color:#cbd5e1;
}

.top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:14px;
}

.user-box{
    color:#0f172a;
    font-weight:600;
    font-size:15px;
}

#user{
    font-weight:800;
}

.logout{
    background:#ef4444;
    border:none;
    color:white;
    padding:9px 13px;
    border-radius:999px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(239,68,68,.25);
}

/* ================= BUSCA ================= */

.busca{
    padding:14px 12px 6px;
}

.busca input{
    width:100%;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid var(--borda);
    background:white;
    color:var(--texto);
    font-size:14px;
    outline:none;
    box-shadow:0 8px 20px rgba(15,23,42,.05);
}

.busca input:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

/* ================= CARDS STATUS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:10px 12px 12px;
}

.card{
    min-height:74px;
    padding:12px 8px;
    border-radius:16px;
    color:white;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 10px 22px rgba(15,23,42,.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:12px;
    font-weight:800;
}

.card span{
    font-size:25px;
    line-height:1;
}

.andamento{
    background:linear-gradient(135deg,#f59e0b,#f97316);
}

.concluido{
    background:linear-gradient(135deg,#16a34a,#22c55e);
}

.ausente{
    background:linear-gradient(135deg,#ef4444,#dc2626);
}

.active{
    transform:translateY(-2px) scale(1.02);
    outline:3px solid rgba(37,99,235,.18);
}

.andamento.active{ box-shadow:0 0 0 3px rgba(245,158,11,.18), 0 12px 28px rgba(245,158,11,.25); }
.concluido.active{ box-shadow:0 0 0 3px rgba(34,197,94,.18), 0 12px 28px rgba(34,197,94,.25); }
.ausente.active{ box-shadow:0 0 0 3px rgba(239,68,68,.18), 0 12px 28px rgba(239,68,68,.25); }

/* ================= LISTA OS ================= */

.container{
    padding:4px 12px 18px;
}

.container > p{
    background:white;
    border:1px solid var(--borda);
    border-radius:16px;
    padding:28px 16px;
    text-align:center;
    color:var(--muted);
    font-weight:800;
    box-shadow:0 8px 22px rgba(15,23,42,.04);
}

.os{
    background:white;
    border:1px solid var(--borda);
    padding:15px 14px 62px;
    border-radius:18px;
    margin-bottom:12px;
    cursor:pointer;
    position:relative;
    box-shadow:0 10px 24px rgba(15,23,42,.06);
    font-size:13px;
    line-height:1.6;
    color:#334155;
    overflow:hidden;
}

.os:before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:5px;
    height:100%;
    background:var(--azul);
}

.os b{
    color:#0f172a;
}

.os > b:first-of-type{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 10px;
    border-radius:999px;
    font-size:12px;
    margin-bottom:6px;
}

.data-right{
    position:absolute;
    right:12px;
    top:14px;
    max-width:48%;
    text-align:right;
    font-size:11px;
    color:#64748b;
    font-weight:800;
    line-height:1.3;
}

.btn-whatsapp{
    position:absolute;
    right:12px;
    bottom:12px;
    width:46px;
    height:46px;
    border-radius:50%;
    border:none;
    background:var(--whatsapp);
    color:white;
    font-size:21px;
    box-shadow:0 10px 22px rgba(37,211,102,.28);
    cursor:pointer;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(15,23,42,.72);
    display:none;
    justify-content:center;
    align-items:flex-end;
    z-index:9999;
    padding:16px;
}

.modal-content{
    background:white;
    padding:20px;
    border-radius:22px 22px 18px 18px;
    width:100%;
    max-width:460px;
    max-height:92vh;
    overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.35);
    animation:modalUp .18s ease-out;
}

@keyframes modalUp{
    from{ transform:translateY(20px); opacity:.4; }
    to{ transform:translateY(0); opacity:1; }
}

.modal-content h3{
    margin:0 0 14px;
    color:#0f172a;
    font-size:20px;
    text-align:center;
}

.modal input,
.modal textarea{
    width:100%;
    margin:6px 0 10px;
    padding:12px;
    border:1px solid var(--borda);
    border-radius:12px;
    outline:none;
    font-size:14px;
    background:#fff;
}

.modal textarea{
    min-height:95px;
    resize:vertical;
}

.modal input:focus,
.modal textarea:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.modal button{
    width:100%;
    margin:6px 0;
    padding:12px;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
}

.btn-ausente{
    background:#f59e0b;
}

.btn-inv{
    background:#ef4444;
}

.btn-ok{
    background:#16a34a;
}

.btn-loc{
    background:#0f172a;
}

.modal button:last-child{
    background:#64748b;
}

/* ================= TOAST NOVA OS ================= */

.toast-os{
    position:fixed;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    background:#ef4444;
    color:#fff;
    padding:16px 22px;
    border-radius:16px;
    font-weight:800;
    font-size:16px;
    z-index:999999;
    box-shadow:0 14px 34px rgba(239,68,68,.35);
    transition:.35s;
    opacity:0;
    text-align:center;
    width:calc(100% - 32px);
    max-width:420px;
}

.toast-os.show{
    top:18px;
    opacity:1;
}


/* ================= MENU LATERAL MOBILE ================= */
.mobile-topbar-app{
    height:64px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.menu-btn{width:42px;height:42px;border:none;border-radius:12px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.18);flex:0 0 auto;}
.menu-btn span{display:block;width:20px;height:2px;background:#fff;position:relative;border-radius:99px;}
.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0;width:20px;height:2px;background:#fff;border-radius:99px;}
.menu-btn span:before{top:-7px}.menu-btn span:after{top:7px}
.topbar-title{min-width:0;flex:1}.topbar-title strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar-title small{display:block;color:#64748b;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1999;opacity:0;pointer-events:none;transition:.25s;}.drawer-overlay.show{opacity:1;pointer-events:auto;}
.side-drawer{position:fixed;left:0;top:0;height:100vh;width:280px;max-width:82vw;background:linear-gradient(180deg,#081a31,#061426);z-index:2000;transform:translateX(-100%);transition:.25s ease;color:#fff;padding:16px;display:flex;flex-direction:column;box-shadow:18px 0 45px rgba(0,0,0,.32);}
.side-drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.drawer-head img{width:148px;max-height:58px;object-fit:contain}.drawer-close{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:22px}
.drawer-user{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:14px}.drawer-user strong{display:block;font-size:14px}.drawer-user small{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}
.drawer-nav{display:flex;flex-direction:column;gap:7px}.drawer-nav a{color:#dbeafe;text-decoration:none;display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;font-size:15px;font-weight:800}.drawer-nav a.active,.drawer-nav a:hover{background:#2563eb;color:#fff}.drawer-nav .ico{width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}.drawer-footer{margin-top:auto}.drawer-logout{width:100%;border:none;background:#ef4444;color:#fff;border-radius:14px;padding:13px;font-weight:900;font-size:14px}
.header{position:relative;z-index:1;}

/* ================= RESPONSIVO ================= */

@media(min-width:760px){
    body{
        max-width:520px;
        margin:0 auto;
        background:#e5e7eb;
    }

    .header{
        margin-top:10px;
        border-radius:24px;
    }
}

@media(max-width:360px){
    .cards{
        gap:7px;
    }

    .card{
        font-size:11px;
        padding:10px 6px;
    }

    .card span{
        font-size:22px;
    }

    .user-box{
        font-size:12px;
        max-width:220px;
    }
}
</style>

</head>

// 🔑 LOGIN VIA APK
// =========================
const params =
new URLSearchParams(
    window.location.search
);

const token =
params.get("token");

const id =
params.get("id");

const app =
params.get("app");

const osPushId = params.get("os_id") || params.get("os") || params.get("id_os");

// =========================
// RECEBE LOGIN APK
// =========================
if(token && id){

    const usuarioAtual =
    JSON.parse(
        localStorage.getItem("usuario") || "{}"
    );

    localStorage.setItem(
        "usuario",
        JSON.stringify({
            ...usuarioAtual,
            id:id,
            log_id:token,
            usuario: params.get("usuario") || usuarioAtual.usuario || ""
        })
    );

    localStorage.setItem("log_id", token);
    localStorage.setItem("usuario_id", id);
    localStorage.setItem("is_app", "1");

    console.log("✅ sessão recebida APK", { id, token });

}

const isApp =
localStorage.getItem("is_app") === "1";

const API = "/api/ordens_servico";

let socket = null;
let socketConectado = false;

let user = {};
let OS = [];
let tab = "andamento";
function setTab(novaTab){

    tab = novaTab;

    render();
}
let osSelecionada = null;
let ultimaQuantidadeOS = 0;
let primeiraCarga = true;


/* ================= SOCKET.IO REALTIME ================= */
function iniciarSocket(){
    try {
        if(socketConectado) return;
        if(typeof io !== "function"){
            console.warn("Socket.IO não carregado no appmobile.html");
            return;
        }

        socket = io(window.location.origin, {
            transports:["websocket", "polling"]
        });

        socket.on("connect", () => {
            console.log("✅ Socket conectado:", socket.id);
            socketConectado = true;

            if(user?.id && user?.empresa_id){
                socket.emit("join", {
                    id:user.id,
                    usuario:user.usuario || user.nome || "Técnico",
                    empresa_id:user.empresa_id
                });
            }
        });

        socket.on("disconnect", () => {
            console.warn("Socket desconectado");
            socketConectado = false;
        });

        socket.on("os_update", () => {
            console.log("🔄 os_update recebido via socket");
            load();
        });

        socket.on("nova_os", () => {
            console.log("🚨 nova_os recebido via socket");
            load();
        });

        socket.on("os_andamento", async (data = {}) => {
            console.log("🚀 os_andamento recebido via socket", data);

            // Força alerta visual/sonoro quando uma OS entra em andamento,
            // mesmo que o ID já existisse na lista.
            tocarSomNovaOS();

            if(navigator.vibrate){
                navigator.vibrate([300, 100, 300]);
            }

            const toast = document.getElementById("toastNovaOS");
            if(toast){
                toast.innerHTML = data.mensagem
                    ? `🚀 ${data.mensagem}`
                    : "🚀 OS ENTROU EM ANDAMENTO!";

                toast.classList.add("show");

                setTimeout(() => {
                    toast.classList.remove("show");
                }, 5000);
            }

            if("Notification" in window){
                if(Notification.permission !== "granted"){
                    await Notification.requestPermission();
                }

                if(Notification.permission === "granted"){
                    new Notification(data.titulo || "🚀 OS em andamento", {
                        body: data.mensagem || "Uma ordem de serviço entrou em andamento",
                        icon: "/img/logo.png",
                        silent: false
                    });
                }
            }

            tab = "andamento";
            await load();
        });

    } catch(err){
        console.error("Erro ao iniciar Socket.IO:", err);
    }
}

// =========================

console.log("=== DEBUG LOGIN ===");

if("Notification" in window){

/* ================= LOAD ================= */
/* ================= LOAD ================= */

let idsJaCarregados = new Set();

async function load(){

    if(!user.id){
        console.error("Sem user.id");
        return;
    }

    try {

        const res = await fetch(API, {
            headers: {
                "x-usuario-id": user.id
            }
        });

        const novaLista = await res.json();

        // =========================
        // DETECTA NOVAS OS
        // =========================
        const novosIds = [];

        novaLista.forEach(os => {

            // primeira vez NÃO notifica
            if(primeiraCarga){
                idsJaCarregados.add(os.id);
                return;
            }

            // nova OS encontrada
            if(!idsJaCarregados.has(os.id)){

                idsJaCarregados.add(os.id);

                novosIds.push(os.id);

            }

        });

        // remove ids inexistentes
        const idsAtuais =
        new Set(novaLista.map(o => o.id));

        idsJaCarregados.forEach(id => {

            if(!idsAtuais.has(id)){
                idsJaCarregados.delete(id);
            }

        });

        // =========================
        // NOTIFICA
        // =========================
        if(novosIds.length > 0){

            tocarSomNovaOS();

            mostrarNotificacao(novosIds.length);

            console.log(
                "Nova OS detectada:",
                novosIds
            );

        }

        primeiraCarga = false;

        OS = novaLista;

        abrirOSDaNotificacaoSeExistir();

    } catch (e){

        console.error(
            "Erro ao carregar OS:",
            e
        );

        OS = [];
    }

    render();
}

/* ================= RENDER ================= */
function render(){

    const inputBusca = document.getElementById("busca");
    const busca = inputBusca ? inputBusca.value.toLowerCase() : "";

    const norm = s => (s||"").toLowerCase();

    const filtrado = OS.filter(o => {

        const matchBusca =
            String(o.id).includes(busca) ||
            norm(o.nome).includes(busca);

        const matchStatus =
            (tab === "andamento" && norm(o.status).includes("andamento")) ||
            (tab === "concluido" && norm(o.status).includes("concluido")) ||
            (tab === "ausente" && norm(o.status).includes("ausente"));

        return matchBusca && matchStatus;
    });

    // CONTADORES
    document.getElementById("cA").innerText =
        OS.filter(o => norm(o.status).includes("andamento")).length;

    document.getElementById("cC").innerText =
        OS.filter(o => norm(o.status).includes("concluido")).length;

    document.getElementById("cX").innerText =
        OS.filter(o => norm(o.status).includes("ausente")).length;

    // ATIVO
    document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
    const activeCard = document.querySelector("." + tab);
    if(activeCard) activeCard.classList.add("active");

    const el = document.getElementById("lista");

    if(!filtrado.length){
        el.innerHTML = "<p>Nenhuma OS</p>";
        return;
    }

    el.innerHTML = filtrado.map(o => {

        let dataTopo = "";
        let extras = "";

        // =========================
        // ANDAMENTO / AUSENTE
        // =========================
        if(tab === "andamento" || tab === "ausente"){
            dataTopo = format(o.iniciado_em);

            extras = `
            <b>Enviado por:</b> ${o.criado_por_nome || '-'}<br>
            <b>Iniciado em:</b> ${format(o.iniciado_em)}<br>
            <b>Agendamento:</b> ${format(o.agendamento)}<br>
            <b>VLAN:</b> ${o.vlan || '-'}<br>
            `;
        }

        // =========================
        // CONCLUÍDO
        // =========================
        if(tab === "concluido"){
            dataTopo = format(o.finalizado_em);

            extras = `
            <b>Iniciado em:</b> ${format(o.iniciado_em)}<br>
            <b>Finalizado em:</b> ${format(o.finalizado_em)}<br>
            <b>Iniciado por:</b> ${o.enviado_por_nome || o.iniciado_por || '-'}<br>
            <b>Finalizado por:</b> ${o.finalizado_por_nome || o.finalizado_por || '-'}<br>
            <b>VLAN:</b> ${o.vlan || '-'}<br>
            `;
        }

        return `
        <div class="os" onclick="abrirModal(${o.id})">
            <div class="data-right">${dataTopo}</div>

            <b>OS #${o.id}</b><br><br>

            <b>Cliente:</b> ${o.nome || '-'}<br>
            <b>Localidade:</b> ${o.localidade_nome || '-'}<br>
            <b>Tipo:</b> ${o.tipo_servico_nome || '-'}<br>
            <b>Plano:</b> ${o.plano_nome || '-'}<br>

            <b>VLAN:</b> ${o.vlan || '-'}<br>

            <b>Endereço:</b> ${o.rua || ''}, ${o.referencia || ''} (${o.bairro || ''})<br>
            <b>Login:</b> ${o.login || '-'}<br>
            <b>ID:</b> ${o.id_cliente || '-'}<br>
            <b>Telefone:</b> ${o.telefone || '-'}<br>

            ${extras}

            <b>Técnicos:</b> ${o.tecnicos_nomes || '-'}<br>

            <button class="btn-whatsapp" onclick="compartilhar(event, ${o.id})">
                📲
            </button>
        </div>`;
    }).join("");
}

/* ================= AÇÕES ================= */
async function enviarAcao(tipo){

    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    try {

        const obs = document.getElementById("obs").value;

        const fotoInput = document.getElementById("foto");

        const formData = new FormData();

        formData.append("observacao", obs);

        if(fotoInput.files[0]){
            formData.append("foto", fotoInput.files[0]);
        }

        let rota = "";

        if(tipo === "ausente"){
            rota = `/api/ordens_servico/ausente/${osSelecionada}`;
        }

        if(tipo === "inviabilidade"){
            rota = `/api/ordens_servico/inviabilidade/${osSelecionada}`;
        }

        if(tipo === "concluir"){
            rota = `/api/ordens_servico/concluir/${osSelecionada}`;
        }

        const res = await fetch(rota, {
            method: "POST",
            headers: {
                "x-usuario-id": user.id
            },
            body: formData
        });

        const data = await res.json();

        if(!res.ok){
            throw new Error(data.erro || "Erro");
        }

        alert("OS atualizada com sucesso");

        fecharModal();

        load();

    } catch(err){

        console.error(err);

        alert("Erro ao executar ação");
    }
}

/* ================= MODAL ================= */
function abrirModal(id){

    if(tab !== "andamento") return;

    osSelecionada = id;
    const modal = document.getElementById("modal");
    if(modal) modal.style.display = "flex";
}

function fecharModal(){
    const modal = document.getElementById("modal");
    if(modal) modal.style.display = "none";
}

/* ================= UTIL ================= */
function format(d){
    if(!d) return "-";
    return new Date(d).toLocaleString("pt-BR");
}

/* ================= WHATS ================= */
function compartilhar(e, id){

    e.stopPropagation();

    const os = OS.find(o => o.id === id);
    if(!os) return;

    const msg = `
🧾 OS #${os.id}

👤 Cliente: ${os.nome || '-'}
📍 Localidade: ${os.localidade_nome || '-'}
🛠️ Tipo: ${os.tipo_servico_nome || '-'}
📦 Plano: ${os.plano_nome || '-'}

🏠 Endereço: ${os.rua || ''}, ${os.referencia || ''} (${os.bairro || ''})

🔐 Login: ${os.login || '-'}
🆔 ID: ${os.id_cliente || '-'}
📞 Telefone: ${os.telefone || '-'}
`.trim();

    window.open("https://wa.me/?text=" + encodeURIComponent(msg));
}


/* ================= VER ANEXO ================= */
function verAnexo(){

    const os = OS.find(o => o.id === osSelecionada);

    if(!os || !os.anexo_path){
        alert("Nenhum anexo encontrado");
        return;
    }

    const url = os.anexo_path.startsWith("http")
        ? os.anexo_path
        : window.location.origin + os.anexo_path;

    window.open(url, "_blank");
}

/* ================= LOCALIZAÇÃO ================= */
async function pegarLocalizacao(){

    if(!osSelecionada){
        alert("Nenhuma OS selecionada");
        return;
    }

    if(!navigator.geolocation){
        alert("GPS não suportado neste dispositivo");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (pos) => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        try {

            const res = await fetch(`/api/ordens_servico/localizacao/${osSelecionada}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-usuario-id": user.id
                },
                body: JSON.stringify({
    latitude: lat,
    longitude: lng
})
            });

            const data = await res.json();

            if(!res.ok){
                throw new Error(data.erro || "Erro ao salvar localização");
            }

            alert("📍 Localização enviada com sucesso!");

        } catch (err){
            console.error(err);
            alert("Erro ao enviar localização");
        }

    }, () => {
        alert("Não foi possível obter GPS");
    });

}

function visualizarLocalizacao(){

    const os = OS.find(o => o.id === osSelecionada);

    if(!os){
        alert("OS não encontrada");
        return;
    }

    if(!os.latitude || !os.longitude){
        alert("Sem localização registrada");
        return;
    }

    const url = `https://www.google.com/maps?q=${os.latitude},${os.longitude}`;

    window.open(url, "_blank");
}

/* ================= SOM ================= */
function tocarSomNovaOS(){

    const audio = new Audio(
        "https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
    );

    audio.volume = 1;

/* ================= NOTIFICAÇÃO APP ================= */

async function mostrarNotificacao(qtd = 1){

    try {

        // =========================
        // SOM
        // =========================
        tocarSomNovaOS();

        // =========================
        // VIBRAÇÃO
        // =========================
        if(navigator.vibrate){

            navigator.vibrate([
                300,
                100,
                300
            ]);

        }

        // =========================
        // TOAST VISUAL
        // =========================
        const toast =
        document.getElementById(
            "toastNovaOS"
        );

        if(toast){

            toast.innerHTML =
            qtd > 1
            ? `🚨 ${qtd} NOVAS OS LANÇADAS!`
            : "🚨 NOVA OS LANÇADA!";

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 5000);

        }

        // =========================
        // NOTIFICAÇÃO WEB
        // =========================
        if(
            "Notification" in window
        ){

            if(
                Notification.permission
                !== "granted"
            ){

                await Notification
                .requestPermission();

            }

            if(
                Notification.permission
                === "granted"
            ){

                new Notification(
                    "🚨 NOVA OS LANÇADA!",
                    {
                        body:
                        qtd > 1
                        ? `${qtd} novas ordens de serviço`
                        : "Você recebeu uma nova ordem de serviço",

                        icon:"/img/logo.png",
                        silent:false
                    }
                );

            }

        }

    } catch(err){

        console.log(
            "Erro notificação:",
            err
        );

    }
}


/* ================= PUSH NOTIFICATION REAL - CAPACITOR / FCM ================= */
let pushRegistrado = false;

function getPushPlugin(){
    try {
        const cap = window.Capacitor;

        console.log("Capacitor disponível:", !!cap);
        console.log("Plugins disponíveis:", cap?.Plugins ? Object.keys(cap.Plugins) : []);

        if(cap?.Plugins?.PushNotifications){
            return cap.Plugins.PushNotifications;
        }

        if(cap?.Plugins?.PushNotificationsPlugin){
            return cap.Plugins.PushNotificationsPlugin;
        }

        if(window.PushNotifications){
            return window.PushNotifications;
        }

        return null;
    } catch(e){
        console.error("Erro ao localizar plugin PushNotifications:", e);
        return null;
    }
}

async function salvarTokenPush(token){
    if(!token){
        console.warn("Token FCM vazio");
        return;
    }

    if(!user || !user.id){
        console.warn("Usuário não carregado; não foi possível salvar token FCM");
        return;
    }

    try {
        const res = await fetch("/api/push/token", {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "x-usuario-id": user.id
            },
            body:JSON.stringify({
                token_fcm: token,
                plataforma: "android",
                device_id: localStorage.getItem("device_id") || null
            })
        });

        const data = await res.json().catch(() => ({}));

        if(!res.ok){
            throw new Error(data.erro || "Erro ao salvar token FCM");
        }

        localStorage.setItem("push_token_fcm", token);
        console.log("✅ Token FCM salvo no SGOS:", token.substring(0, 25) + "...");
    } catch(err){
        console.error("Erro ao salvar token FCM:", err);
    }
}

async function iniciarPush(){
    console.log("========== INICIANDO PUSH ==========");

    if(pushRegistrado){
        console.log("Push já registrado nesta sessão");
        return;
    }

    const PushNotifications = getPushPlugin();

    console.log("PushNotifications plugin:", PushNotifications);

    if(!PushNotifications){
        console.warn("Push Capacitor não encontrado. No navegador comum ficará apenas socket/polling + Notification API.");
        return;
    }

    pushRegistrado = true;

    try {
        // Registra listeners ANTES do register para não perder o token.
        await PushNotifications.addListener("registration", async (token) => {
            console.log("✅ FCM Token:", token.value);
            await salvarTokenPush(token.value);
        });

        await PushNotifications.addListener("registrationError", (err) => {
            console.error("Erro no registro push:", err);
        });

        await PushNotifications.addListener("pushNotificationReceived", (notification) => {
            console.log("Push recebido com app aberto:", notification);

            tocarSomNovaOS();
            if(navigator.vibrate) navigator.vibrate([300,100,300]);

            const osId = notification?.data?.os_id || notification?.data?.id_os || notification?.data?.id;

            if(osId){
                localStorage.setItem("abrir_os_push", String(osId));
                load();
            }else{
                mostrarNotificacao(1);
            }
        });

        await PushNotifications.addListener("pushNotificationActionPerformed", (event) => {
            console.log("Notificação tocada:", event);

            const data = event?.notification?.data || {};
            const osId = data.os_id || data.id_os || data.id;

            if(osId){
                localStorage.setItem("abrir_os_push", String(osId));
                window.location.href = `appmobile.html?app=1&os_id=${encodeURIComponent(osId)}`;
            }else{
                window.location.href = "appmobile.html?app=1";
            }
        });

        const perm = await PushNotifications.requestPermissions();
        console.log("Permissão push:", perm);

        if(perm.receive !== "granted"){
            console.warn("Permissão de push negada pelo usuário");
            return;
        }

        await PushNotifications.register();
        console.log("✅ PushNotifications.register() executado");

    } catch(err){
        console.error("Erro ao iniciar push:", err);
        pushRegistrado = false;
    }
}

function abrirOSDaNotificacaoSeExistir(){
    const idNotificacao = osPushId || localStorage.getItem("abrir_os_push");

    if(!idNotificacao || !OS.length) return;

    const os = OS.find(o => String(o.id) === String(idNotificacao));

    if(!os) return;

    localStorage.removeItem("abrir_os_push");

    tab = "andamento";
    render();

    setTimeout(() => {
        abrirModal(os.id);
        const card = document.querySelector(`.os[onclick="abrirModal(${os.id})"]`);
        if(card) card.scrollIntoView({ behavior:"smooth", block:"center" });
    }, 300);
}
