</head><body><script>
function getApiBase(){
    const salvo = localStorage.getItem("api_base");
    if(salvo) return String(salvo).replace(/\/$/, "");

    const provedor = localStorage.getItem("provedor");
    if(provedor) return `https://${provedor}.sgos.net.br`;

    if(location.protocol.startsWith("http")){
        return location.origin;
    }

    return "";
}

function apiUrl(path){
    if(!path) return getApiBase();
    if(/^https?:\/\//i.test(path)) return path;

    const base = getApiBase();
    if(!base) return path;

    return base + (path.startsWith("/") ? path : "/" + path);
}

function headersSessaoAppPlanos(){
    const u = getUsuarioLocal();
    const sessao = (()=>{try{return JSON.parse(localStorage.getItem("sessao_app")||"{}")}catch(e){return {}}})();
    const logId = localStorage.getItem("log_id") || u.log_id || sessao.log_id || "";
    const empresaId = u.empresa_id || u.empresaId || sessao.empresa_id || localStorage.getItem("empresa_id") || "";
    const usuarioId = u.id || localStorage.getItem("usuario_id") || sessao.id || "";
    const headers = {};
    if(usuarioId) headers["x-usuario-id"] = String(usuarioId);
    if(logId) headers["x-log-id"] = String(logId);
    if(empresaId) headers["x-empresa-id"] = String(empresaId);
    headers["x-sgos-app"] = "1";
    headers["x-sgos-active"] = "1";
    return headers;
}

function apiFetch(path, options = {}){
    const urlFinal = apiUrl(path);
    const opcoes = {...options};
    const headers = new Headers(opcoes.headers || {});
    Object.entries(headersSessaoAppPlanos()).forEach(([k,v])=>{
        if(v !== undefined && v !== null && String(v) !== "" && !headers.has(k)) headers.set(k,String(v));
    });
    opcoes.headers = headers;

    try{
        const destino = new URL(urlFinal, window.location.href);
        if(destino.origin !== window.location.origin){
            opcoes.credentials = "omit";
        }else if(!opcoes.credentials){
            opcoes.credentials = "same-origin";
        }
    }catch(e){
        if(!opcoes.credentials) opcoes.credentials = "same-origin";
    }

    return fetch(urlFinal, opcoes);
}

function resolverUrlArquivo(url){
    if(!url) return "";
    if(/^https?:\/\//i.test(url)) return url;
    return apiUrl(url.startsWith("/") ? url : "/" + url);
}

function getUsuarioLocal(){try{return JSON.parse(localStorage.getItem("usuario")||"{}")}catch(e){return {}}}
function getTecnicoId(user){return user.tecnico_id||user.tecnicoId||user.id_tecnico||user.idTecnico||user.id}
function getNomeTecnico(user){return (user.tecnico_nome||user.nome||user.usuario||"").toString().toLowerCase()}
function abrirMenu(){document.getElementById("sideDrawer")?.classList.add("open");document.getElementById("drawerOverlay")?.classList.add("show")}
function fecharMenu(){document.getElementById("sideDrawer")?.classList.remove("open");document.getElementById("drawerOverlay")?.classList.remove("show")}
function logout(){localStorage.removeItem("usuario");localStorage.removeItem("usuario_id");window.location.href="index.html"}
async function prepararTopo(active){
 const user=getUsuarioLocal();
 if(!user.id){window.location.href="index.html";return null}
 let completo={};
 try{const r=await apiFetch("/api/me",{headers:{"x-usuario-id":user.id}});completo=await r.json()}catch(e){}
 const u={...user,...(completo||{})};localStorage.setItem("usuario",JSON.stringify(u));
 const nome=u.usuario||u.nome||("ID "+u.id); const emp=u.empresa_nome||"SGOS Técnico";
 ["topUser","drawerUser"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerText=nome});
 ["topEmpresa","drawerEmpresa"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerText=emp});

 let logoEmpresa = u.empresa_logo || "https://iili.io/CujQzXa.png";

if (logoEmpresa) {
    logoEmpresa = resolverUrlArquivo(logoEmpresa);
}

// Logo da empresa (topo)
const topLogo = document.getElementById("topLogo");
if (topLogo) {
    topLogo.src = logoEmpresa;
}

 document.querySelectorAll(".drawer-nav a").forEach(a=>{if(a.dataset.page===active)a.classList.add("active")});
 return u;
}

    <div class="drawer-user">
        <strong id="drawerUser">Carregando...</strong>
        <small id="drawerEmpresa">Empresa</small>
    </div>

    <nav class="drawer-nav">
        <a data-page="os" href="appmobile.html"><span class="ico">▤</span><span>Ordens de Serviço</span></a>
        <a data-page="escala" href="app-escala.html"><span class="ico">□</span><span>Escala</span></a>
        <a data-page="viabilidades" href="app-viabilidades.html"><span class="ico">⌖</span><span>Viabilidades</span></a>
        <a data-page="planos" href="app-planos.html" class="active"><span class="ico">▣</span><span>Planos</span></a>
        <a data-page="historico" href="app-historico-os.html"><span class="ico">◷</span><span>Histórico de OS</span></a>
    </nav>

    <div class="drawer-footer">
        <button class="drawer-logout" onclick="logout()" type="button">Sair</button>
    </div>
</aside>
<div class="mobile-topbar-app"><button class="menu-btn" onclick="abrirMenu()" type="button" aria-label="Abrir menu"><span></span></button><div class="topbar-title"><strong>${title}</strong><small id="topEmpresa">${subtitle}</small></div><img id="topLogo" class="topbar-brand" src="" alt="Logo da empresa"></div>
`;}
function formatarDataHora(v){if(!v)return"-";const d=new Date(v);return isNaN(d)?"-":d.toLocaleString("pt-BR")}
function formatarData(v){if(!v)return"-";const d=new Date((String(v).split("T")[0]||v)+"T00:00:00");return isNaN(d)?"-":d.toLocaleDateString("pt-BR")}
</script><script>document.write(mobileLayout("Planos","SGOS Técnico","planos"));</script><main class="content">
<div class="mini-cards"><div class="mini-card"><strong id="cardTotal">0</strong><span>Total</span></div><div class="mini-card"><strong id="cardAtivos">0</strong><span>Ativos</span></div><div class="mini-card"><strong id="cardFiltro">0</strong><span>Exibidos</span></div></div>
<div class="card-box"><h2 class="section-title">Consultar planos</h2><input class="input" id="buscaPlano" placeholder="Buscar plano..." oninput="renderPlanos()"></div><div id="listaPlanos"></div>
</main></div><script>
let usuarioAtual=null, planos=[];

async function lerJsonSeguroPlanos(res){
    const texto = await res.text();
    if(!texto) return {};
    try{return JSON.parse(texto)}catch(e){return {erro:texto}}
}

function extrairListaPlanos(data){
    if(Array.isArray(data)) return data;
    if(!data || typeof data !== "object") return [];

    const candidatos = [
        data.planos,
        data.dados,
        data.data,
        data.resultado,
        data.resultados,
        data.items,
        data.rows,
        data.registros,
        data.lista,
        data.data?.planos,
        data.dados?.planos,
        data.resultado?.planos
    ];

    for(const item of candidatos){
        if(Array.isArray(item)) return item;
    }
    return [];
}

function textoPlano(p){
    return String(
        p?.nome ?? p?.plano ?? p?.plano_nome ?? p?.nome_plano ??
        p?.descricao ?? p?.titulo ?? ""
    ).trim();
}

function valorPlano(p){
    return p?.valor ?? p?.preco ?? p?.mensalidade ?? p?.valor_plano ?? null;
}

function planoInativo(p){
    const ativo = p?.ativo ?? p?.is_ativo ?? p?.active;
    if(ativo === 0 || ativo === false || String(ativo).toLowerCase() === "false") return true;
    const status = String(p?.status ?? p?.situacao ?? "").trim().toLowerCase();
    return ["inativo","desativado","cancelado"].includes(status);
}

async function carregarPlanos(){
    const el=document.getElementById('listaPlanos');
    el.innerHTML='<div class="empty">Carregando planos...</div>';
    try{
        const r=await apiFetch('/api/planos',{headers:{'Accept':'application/json'}});
        const data=await lerJsonSeguroPlanos(r);
        console.log('📦 Resposta /api/planos:', data);

        if(!r.ok){
            throw new Error(data?.erro || data?.mensagem || data?.message || `Erro HTTP ${r.status}`);
        }

        planos=extrairListaPlanos(data);
        console.log('📋 Planos carregados:', planos.length, planos);
        renderPlanos();
    }catch(err){
        console.error('Erro ao carregar planos:',err);
        planos=[];
        renderPlanos();
        el.innerHTML=`<div class="empty">Não foi possível carregar os planos.<br><small>${String(err.message||err)}</small></div>`;
    }
}

function renderPlanos(){
    const busca=(document.getElementById('buscaPlano').value||'').trim().toLowerCase();
    const lista=planos.filter(p=>{
        const texto=[textoPlano(p),p?.descricao,p?.velocidade,p?.id,p?.id_plano].filter(Boolean).join(' ').toLowerCase();
        return !busca || texto.includes(busca);
    });

    document.getElementById('cardTotal').innerText=planos.length;
    document.getElementById('cardAtivos').innerText=planos.filter(p=>!planoInativo(p)).length;
    document.getElementById('cardFiltro').innerText=lista.length;

    const el=document.getElementById('listaPlanos');
    if(!lista.length){
        el.innerHTML='<div class="empty">Nenhum plano encontrado.</div>';
        return;
    }

    el.innerHTML=lista.map(p=>{
        const nome=textoPlano(p)||'-';
        const velocidade=p?.velocidade ?? p?.velocidade_nome ?? p?.banda ?? '';
        const valor=valorPlano(p);
        const inativo=planoInativo(p);
        return `<div class="list-card">
            <h3>${nome}</h3>
            ${velocidade?`<p><b>Velocidade:</b> ${velocidade}</p>`:''}
            ${valor!==null && valor!==''?`<p><b>Valor:</b> R$ ${valor}</p>`:''}
            <p><span class="pill ${inativo?'red':'green'}">${inativo?'Inativo':'Ativo'}</span></p>
        </div>`;
    }).join('');
}

document.addEventListener('DOMContentLoaded',async()=>{
    usuarioAtual=await prepararTopo('planos');
    if(!usuarioAtual)return;
    await carregarPlanos();
});
</script></body></html>
