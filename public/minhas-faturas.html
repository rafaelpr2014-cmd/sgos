<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SGOS - Meu Financeiro</title><script src="/js/auth.js"></script><script src="/js/init.js"></script><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#0f172a}header,main{max-width:1400px;margin:auto}header{padding:18px;display:flex;justify-content:space-between;align-items:center}main{padding:0 18px 30px}.hero,.box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:16px}.hero{background:#0f2f5f;color:#fff;display:flex;justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px}.status{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold}.ok{background:#dcfce7;color:#15803d}.warn{background:#fef3c7;color:#a16207}.bad{background:#fee2e2;color:#b91c1c}.notice{padding:14px;border-radius:12px;margin-bottom:16px;background:#fff7ed;border:1px solid #fed7aa}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#0f2f5f;color:white}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:bold;text-decoration:none;cursor:pointer}.blue{background:#2563eb;color:#fff}.light{background:#eaf0ff;color:#1e40af}.orange{background:#ffedd5;color:#9a3412}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.modal>div{background:white;padding:20px;border-radius:14px;width:min(560px,92%)}input,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#64748b;font-size:12px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.hero{flex-direction:column;gap:10px}}</style></head><body><header><h2>Meu Financeiro</h2><div class="row"><a class="btn light" href="/painel.html">Voltar</a><button class="btn orange" onclick="logout()">Sair</button></div></header><main><section class="hero"><div><h1 id="empresaNome">Carregando...</h1><div id="plano"></div></div><div><span id="status" class="status warn">...</span></div></section><section id="aviso" class="notice" hidden><b id="avisoTitulo"></b><div id="avisoMsg"></div></section><section class="cards"><div class="card">Em aberto<h2 id="aberto">R$ 0,00</h2></div><div class="card">Pendentes<h2 id="pendentes">0</h2></div><div class="card">Pagas<h2 id="pagas">0</h2></div><div class="card">Último pagamento<h2 id="ultimo">-</h2></div></section><section class="box"><h3>Minhas faturas</h3><div class="table"><table><thead><tr><th>Competência</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Pagamento</th><th>Promessa</th><th>Ações</th></tr></thead><tbody id="faturas"></tbody></table></div></section><section class="box"><h3>Solicitações de promessa</h3><div id="solicitacoes"></div></section></main><div id="modal" class="modal"><div><h3>Solicitar promessa</h3><p id="faturaInfo"></p><label>Data pretendida<input id="data" type="date"></label><label>Justificativa<textarea id="obs"></textarea></label><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn light" id="cancelar">Cancelar</button><button class="btn blue" id="enviar">Enviar</button></div></div></div><script src="/js/minhas-faturas.js?v=20260802-f4"></script></body></html>
