<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SGOS Técnico - Escala</title><link rel="icon" type="image/png" href="/img/favicon.png"><style>
:root{
    --azul:#2563eb;--azul-dark:#081a31;--fundo:#f5f7fb;--card:#fff;--texto:#0f172a;--muted:#64748b;--borda:#e5e7eb;--verde:#16a34a;--laranja:#f59e0b;--vermelho:#ef4444;--whatsapp:#25D366;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--texto);min-height:100vh;}
.mobile-shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--fundo);position:relative;overflow-x:hidden;}
.mobile-topbar{height:64px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;z-index:1000;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.menu-btn{width:42px;height:42px;border:none;border-radius:12px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.18);flex:0 0 auto}.menu-btn span{display:block;width:20px;height:2px;background:#fff;position:relative;border-radius:99px}.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0;width:20px;height:2px;background:#fff;border-radius:99px}.menu-btn span:before{top:-7px}.menu-btn span:after{top:7px}
.top-logo{height:38px;max-width:120px;object-fit:contain}.top-title{min-width:0;flex:1}.top-title strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-title small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-user{font-size:20px;border:none;background:#f1f5f9;border-radius:12px;width:40px;height:40px;flex:0 0 auto}.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1999;opacity:0;pointer-events:none;transition:.25s}.drawer-overlay.show{opacity:1;pointer-events:auto}.side-drawer{position:fixed;left:0;top:0;height:100vh;width:280px;max-width:82vw;background:linear-gradient(180deg,#081a31,#061426);z-index:2000;transform:translateX(-100%);transition:.25s ease;color:#fff;padding:16px;display:flex;flex-direction:column;box-shadow:18px 0 45px rgba(0,0,0,.32)}.side-drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.drawer-head img{width:148px;max-height:58px;object-fit:contain}.drawer-close{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:22px}.drawer-user{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;margin-bottom:14px}.drawer-user strong{display:block;font-size:14px}.drawer-user small{display:block;color:#cbd5e1;font-size:12px;margin-top:3px}.drawer-nav{display:flex;flex-direction:column;gap:7px}.drawer-nav a{color:#dbeafe;text-decoration:none;display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;font-size:15px;font-weight:800}.drawer-nav a.active,.drawer-nav a:hover{background:#2563eb;color:#fff}.drawer-nav .ico{width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center}.drawer-footer{margin-top:auto}.drawer-logout{width:100%;border:none;background:#ef4444;color:#fff;border-radius:14px;padding:13px;font-weight:900;font-size:14px}.content{padding:14px 12px 22px}.card-box{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 10px 24px rgba(15,23,42,.06)}.section-title{font-size:17px;font-weight:900;margin:0 0 12px}.input,.select{width:100%;padding:12px 13px;border:1px solid var(--borda);border-radius:13px;background:#fff;outline:none;font-size:14px}.input:focus,.select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted)}.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.mini-card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 8px 20px rgba(15,23,42,.05)}.mini-card strong{font-size:22px;display:block;color:#0f172a}.mini-card span{font-size:11px;color:#64748b;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.pill.green{background:#dcfce7;color:#15803d}.pill.orange{background:#ffedd5;color:#c2410c}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.red{background:#fee2e2;color:#dc2626}.empty{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:26px 14px;text-align:center;color:#64748b;font-weight:800}.list-card{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 10px 24px rgba(15,23,42,.06);font-size:13px;line-height:1.55;position:relative;overflow:hidden}.list-card:before{content:"";position:absolute;left:0;top:0;width:5px;height:100%;background:#2563eb}.list-card h3{margin:0 0 8px;padding-left:6px;font-size:15px}.list-card p{margin:3px 0;padding-left:6px}.btn{border:none;border-radius:13px;padding:12px 14px;font-weight:900;color:#fff;background:#2563eb;cursor:pointer}.btn.block{width:100%}.btn-row{display:flex;gap:8px;margin-top:12px}.btn-light{background:#f1f5f9;color:#0f172a}.btn-green{background:#16a34a}.btn-red{background:#ef4444}.table-scroll{overflow-x:auto}.small-table{width:100%;border-collapse:collapse;min-width:520px}.small-table th{background:#f8fafc;font-size:12px;text-align:left;padding:11px;border-bottom:1px solid var(--borda)}.small-table td{font-size:13px;padding:11px;border-bottom:1px solid var(--borda)}
@media(min-width:760px){body{background:#e5e7eb}.mobile-shell{margin:10px auto;border-radius:24px;overflow:hidden;box-shadow:0 18px 60px rgba(15,23,42,.18)}}
</style></head><body><script>
function getUsuarioLocal(){try{return JSON.parse(localStorage.getItem("usuario")||"{}")}catch(e){return {}}}
function getTecnicoId(user){return user.tecnico_id||user.tecnicoId||user.id_tecnico||user.idTecnico||user.id}
function getNomeTecnico(user){return (user.tecnico_nome||user.nome||user.usuario||"").toString().toLowerCase()}
function abrirMenu(){document.getElementById("sideDrawer")?.classList.add("open");document.getElementById("drawerOverlay")?.classList.add("show")}
function fecharMenu(){document.getElementById("sideDrawer")?.classList.remove("open");document.getElementById("drawerOverlay")?.classList.remove("show")}
function logout(){localStorage.removeItem("usuario");localStorage.removeItem("usuario_id");window.location.href="index.html"}
async function prepararTopo(active){
 const user=getUsuarioLocal();
 if(!user.id){window.location.href="index.html";return null}
 let completo={};
 try{const r=await fetch("/api/me",{headers:{"x-usuario-id":user.id}});completo=await r.json()}catch(e){}
 const u={...user,...(completo||{})};localStorage.setItem("usuario",JSON.stringify(u));
 const nome=u.usuario||u.nome||("ID "+u.id); const emp=u.empresa_nome||"SGOS Técnico";
 ["topUser","drawerUser"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerText=nome});
 ["topEmpresa","drawerEmpresa"].forEach(id=>{const el=document.getElementById(id);if(el)el.innerText=emp});
 let logo=u.empresa_logo||"https://iili.io/CujQzXa.png"; if(logo&&!logo.startsWith("http")&&!logo.startsWith("/")) logo="/"+logo;
 ["topLogo","drawerLogo"].forEach(id=>{const el=document.getElementById(id);if(el)el.src=logo});
 document.querySelectorAll(".drawer-nav a").forEach(a=>{if(a.dataset.page===active)a.classList.add("active")});
 return u;
}
function mobileLayout(title, subtitle, active){return `
<div class="mobile-shell">
<div class="drawer-overlay" id="drawerOverlay" onclick="fecharMenu()"></div>
<aside class="side-drawer" id="sideDrawer">
 <div class="drawer-head"><img id="drawerLogo" src="https://iili.io/CujQzXa.png"><button class="drawer-close" onclick="fecharMenu()">×</button></div>
 <div class="drawer-user"><strong id="drawerUser">Carregando...</strong><small id="drawerEmpresa">Empresa</small></div>
 <nav class="drawer-nav">
  <a data-page="os" href="appmobile.html"><span class="ico">🧾</span>Ordens de Serviço</a>
  <a data-page="escala" href="app-escala.html"><span class="ico">📅</span>Escala</a>
  <a data-page="planos" href="app-planos.html"><span class="ico">📦</span>Planos</a>
  <a data-page="historico" href="app-historico-os.html"><span class="ico">🕘</span>Histórico de OS</a>
 </nav>
 <div class="drawer-footer"><button class="drawer-logout" onclick="logout()">Sair</button></div>
</aside>
<header class="mobile-topbar"><button class="menu-btn" onclick="abrirMenu()" aria-label="Abrir menu"><span></span></button><img id="topLogo" class="top-logo"><div class="top-title"><strong>${title}</strong><small id="topEmpresa">${subtitle}</small></div><button class="top-user" title="Usuário">👤</button></header>
`;}
function formatarDataHora(v){if(!v)return"-";const d=new Date(v);return isNaN(d)?"-":d.toLocaleString("pt-BR")}
function formatarData(v){if(!v)return"-";const d=new Date((String(v).split("T")[0]||v)+"T00:00:00");return isNaN(d)?"-":d.toLocaleDateString("pt-BR")}
</script><script>document.write(mobileLayout("Escala","SGOS Técnico","escala"));</script><main class="content">
<div class="mini-cards"><div class="mini-card"><strong id="cardTotal">0</strong><span>Escalas</span></div><div class="mini-card"><strong id="cardHoje">0</strong><span>Hoje</span></div><div class="mini-card"><strong id="cardSemana">0</strong><span>Semana</span></div></div>
<div class="card-box"><h2 class="section-title">Minha escala</h2><div class="grid-2"><input class="input" type="date" id="dataInicio"><input class="input" type="date" id="dataFim"></div><button class="btn block" style="margin-top:10px" onclick="carregarEscala()">Filtrar</button></div>
<div id="listaEscala"></div>
</main></div><script>
let usuarioAtual=null;
function periodoTexto(p){return {MANHA:"Manhã",TARDE:"Tarde",NOITE:"Noite",INTEGRAL:"Integral"}[p]||p||"-"}
function pertenceAoTecnico(e,u){const tid=String(getTecnicoId(u)||""); const nome=getNomeTecnico(u); return String(e.tecnico_id||e.id_tecnico||"")===tid || String(e.tecnico||e.tecnico_nome||e.nome_tecnico||"").toLowerCase().includes(nome)}
function dentroPeriodo(e){const ini=document.getElementById("dataInicio").value; const fim=document.getElementById("dataFim").value; const d=(e.data_escala||e.data||"").split("T")[0]; if(ini&&d<ini)return false; if(fim&&d>fim)return false; return true}
async function carregarEscala(){
 const u=usuarioAtual; const el=document.getElementById("listaEscala"); el.innerHTML='<div class="empty">Carregando escala...</div>';
 try{const r=await fetch('/api/escalas',{headers:{'x-usuario-id':u.id}}); const data=await r.json(); const lista=Array.isArray(data)?data:(data.dados||data.escalas||[]); const minhas=lista.filter(e=>pertenceAoTecnico(e,u)).filter(dentroPeriodo).sort((a,b)=>String(a.data_escala||a.data).localeCompare(String(b.data_escala||b.data)));
 const hoje=new Date().toISOString().slice(0,10); document.getElementById('cardTotal').innerText=minhas.length; document.getElementById('cardHoje').innerText=minhas.filter(e=>String(e.data_escala||e.data).slice(0,10)===hoje).length; const limite=new Date(); limite.setDate(limite.getDate()+7); document.getElementById('cardSemana').innerText=minhas.filter(e=>{const d=new Date(String(e.data_escala||e.data).slice(0,10)+'T00:00:00'); return d>=new Date(hoje+'T00:00:00')&&d<=limite}).length;
 if(!minhas.length){el.innerHTML='<div class="empty">Nenhuma escala encontrada para este técnico.</div>';return}
 el.innerHTML=minhas.map(e=>`<div class="list-card"><h3>${formatarData(e.data_escala||e.data)} <span class="pill blue">${periodoTexto(e.periodo)}</span></h3><p><b>Técnico:</b> ${e.tecnico||e.tecnico_nome||e.nome_tecnico||'-'}</p><p><b>Dia:</b> ${e.dia_semana||e.dia||'-'}</p></div>`).join('');
 }catch(err){console.error(err); el.innerHTML='<div class="empty">Erro ao carregar escala.</div>'}
}
document.addEventListener('DOMContentLoaded',async()=>{usuarioAtual=await prepararTopo('escala'); if(!usuarioAtual)return; const hoje=new Date(); const ini=new Date(); ini.setDate(hoje.getDate()-7); const fim=new Date(); fim.setDate(hoje.getDate()+15); document.getElementById('dataInicio').value=ini.toISOString().slice(0,10); document.getElementById('dataFim').value=fim.toISOString().slice(0,10); carregarEscala();});
</script></body></html>
