workflows:
  ios-capacitor-testflight:
    name: SGOS Mobile iOS TestFlight
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sgos.mobile

    integrations:
      app_store_connect: Codemagic

    scripts:
      - npm install
      - npm install @capacitor/ios
      - npx cap add ios
      - npx cap sync ios
      - cd ios/App
      - pod install
      - xcode-project use-profiles
      - xcode-project build-ipa --workspace App.xcworkspace --scheme App

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true