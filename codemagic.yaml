workflows:
  ios-capacitor-testflight:
    name: SGOS Mobile iOS TestFlight
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sgos.mobile

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Install dependencies
        script: |
          npm install --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Verify Capacitor and Firebase Messaging dependencies
        script: |
          npm list @capacitor/core @capacitor/ios @capacitor/push-notifications @capacitor-firebase/messaging

      - name: Sync existing iOS project
        script: |
          # IMPORTANTE: não recria a pasta ios.
          # Mantém AppDelegate.swift, Info.plist, App.entitlements e project.pbxproj do repositório.
          npx cap sync ios

      - name: Ensure GoogleService-Info.plist is present
        script: |
          if [ -f "assets/GoogleService-Info.plist" ]; then
            cp assets/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          elif [ -f "GoogleService-Info.plist" ]; then
            cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          fi

          if [ ! -f "ios/App/App/GoogleService-Info.plist" ]; then
            echo "ERRO: GoogleService-Info.plist não encontrado em ios/App/App/"
            exit 1
          fi

          echo "GoogleService-Info.plist OK"
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/App/App/GoogleService-Info.plist || true

      - name: Set build number
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $PROJECT_BUILD_NUMBER" ios/App/App/Info.plist

      - name: Apply iOS signing profiles
        script: |
          xcode-project use-profiles

      - name: Diagnostics before build
        script: |
          echo "========== APP.ENTITLEMENTS =========="
          cat ios/App/App/App.entitlements || true

          echo "========== SIGNING SETTINGS =========="
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings | grep -E "CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" || true

          echo "========== GOOGLE SERVICE FILE =========="
          ls -l ios/App/App/GoogleService-Info.plist

      - name: Build IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App

      - name: Check signed entitlements
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa ios/App/build/ios/ipa/*.ipa 2>/dev/null | head -n 1)
          echo "IPA: $IPA"
          rm -rf /tmp/sgos_ipa_check
          mkdir -p /tmp/sgos_ipa_check
          unzip -q "$IPA" -d /tmp/sgos_ipa_check
          APP=$(find /tmp/sgos_ipa_check/Payload -name "*.app" -type d | head -n 1)
          codesign -d --entitlements :- "$APP" || true

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
