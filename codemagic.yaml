workflows:
  ios-capacitor-testflight:
    name: SGOS Mobile iOS TestFlight
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sgos.mobile

    integrations:
      app_store_connect: Codemagic

    scripts:
      - npm install --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - npm install @capacitor/ios --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - npm install @capacitor/push-notifications --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - rm -rf ios
      - npx cap add ios
      - npx @capacitor/assets generate
      - npx cap sync ios

      - cp assets/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist

      - |
        python3 - <<'PY'
        from pathlib import Path

        p = Path("ios/App/App/AppDelegate.swift")
        text = p.read_text()

        code = '''
            func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                NotificationCenter.default.post(
                    name: .capacitorDidRegisterForRemoteNotifications,
                    object: deviceToken
                )
            }

            func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                NotificationCenter.default.post(
                    name: .capacitorDidFailToRegisterForRemoteNotifications,
                    object: error
                )
            }
        '''

        if "capacitorDidRegisterForRemoteNotifications" not in text:
            text = text.rstrip()
            text = text[:-1] + code + "\n}\n"

        p.write_text(text)
        PY

      - |
        cat > ios/App/App/App.entitlements <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>aps-environment</key>
          <string>production</string>
        </dict>
        </plist>
        EOF

      - |
        python3 - <<'PY'
        from pathlib import Path

        p = Path("ios/App/App.xcodeproj/project.pbxproj")
        text = p.read_text()

        text = text.replace("CODE_SIGN_ENTITLEMENTS = App/App.entitlements;", "")

        text = text.replace(
            "PRODUCT_BUNDLE_IDENTIFIER = com.sgos.mobile;",
            "PRODUCT_BUNDLE_IDENTIFIER = com.sgos.mobile;\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;"
        )

        p.write_text(text)
        PY

      - |
        /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist || true
        /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" ios/App/App/Info.plist || true

      - echo "========== APPDELEGATE FINAL =========="
      - cat ios/App/App/AppDelegate.swift
      - echo "========== ENTITLEMENTS FINAL =========="
      - cat ios/App/App/App.entitlements
      - echo "========== BUILD SETTINGS SIGNING =========="
      - xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings | grep -E "CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM" || true

      - /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $PROJECT_BUILD_NUMBER" ios/App/App/Info.plist
      - xcode-project use-profiles
            - |
        set -o pipefail
        xcodebuild -project ios/App/App.xcodeproj \
          -scheme App \
          -archivePath build/ios/xcarchive/App.xcarchive \
          archive \
          COMPILER_INDEX_STORE_ENABLE=NO \
          DEVELOPMENT_TEAM=T7VMAXZY78 \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          CODE_SIGN_STYLE=Manual \
          2>&1 | tee xcodebuild-full.log

        echo "========== ERROS XCODE =========="
        grep -iE "error:|provisioning|entitlement|signing|aps-environment|failed" xcodebuild-full.log || true
        exit 1

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true