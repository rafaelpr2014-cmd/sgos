workflows:
  ios-capacitor-testflight:
    name: SGOS Mobile iOS TestFlight
    instance_type: mac_mini_m2

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sgos.mobile

    integrations:
      app_store_connect: Codemagic

    scripts:
      - name: Instalar dependências
        script: |
          npm install --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Sincronizar Capacitor iOS sem recriar projeto
        script: |
          test -d ios/App || (echo "ERRO: pasta ios/App não existe no repositório. Não vou recriar automaticamente." && exit 1)
          npx cap sync ios

      - name: Garantir GoogleService-Info.plist no iOS
        script: |
          if [ -f assets/GoogleService-Info.plist ]; then
            cp assets/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist copiado para ios/App/App/"
          else
            echo "AVISO: assets/GoogleService-Info.plist não encontrado."
          fi

      - name: Garantir App.entitlements
        script: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

      - name: Validar assinatura e entitlements
        script: |
          grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" ios/App/App.xcodeproj/project.pbxproj || (echo "ERRO: CODE_SIGN_ENTITLEMENTS não está vinculado no project.pbxproj" && exit 1)
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.sgos.mobile;" ios/App/App.xcodeproj/project.pbxproj || (echo "ERRO: bundle identifier com.sgos.mobile não encontrado" && exit 1)
          cat ios/App/App/App.entitlements

      - name: Ajustar número do build
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $PROJECT_BUILD_NUMBER" ios/App/App/Info.plist

      - name: Aplicar perfis de assinatura
        script: |
          xcode-project use-profiles

      - name: Diagnóstico antes do build
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings | grep -E "CODE_SIGN_ENTITLEMENTS|PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" || true
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/App/App/Info.plist || true

      - name: Build IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App

      - name: Validar IPA gerado
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa ios/App/build/ios/ipa/*.ipa 2>/dev/null | head -n 1)
          echo "IPA: $IPA"
          rm -rf /tmp/sgos_ipa_check
          mkdir -p /tmp/sgos_ipa_check
          unzip -q "$IPA" -d /tmp/sgos_ipa_check
          APP=$(find /tmp/sgos_ipa_check/Payload -name "*.app" -type d | head -n 1)
          codesign -d --entitlements :- "$APP" || true

    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
